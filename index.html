function SHOP_shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function SHOP_normalize(s) {
  return (s || "")
    .toLowerCase()
    .trim()
    .replace(/['’ʼ`]/g, "")
    .replace(/[.,!?;:]/g, "")
    .replace(/\s+/g, " ");
}

function SHOP_levenshtein(a, b) {
  const m = a.length,
    n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] =
        a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}

function SHOP_matchesWord(transcript, target) {
  const t = SHOP_normalize(transcript);
  const w = SHOP_normalize(target);
  if (!t) return false;
  if (t === w) return true;
  if (t.includes(w) || w.includes(t)) return true;
  const threshold = Math.max(1, Math.round(w.length * 0.3));
  return SHOP_levenshtein(t, w) <= threshold;
}

function SHOP_speakUkrainian(text) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "uk-UA";
    u.rate = 0.9;
    synth.speak(u);
  } catch (e) {
    /* no-op */
  }
}

function SHOP_buildSparkles() {
  return Array.from({ length: 16 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 16 + Math.random() * 0.3;
    const dist = 60 + Math.random() * 70;
    return {
      id: i,
      tx: Math.cos(angle) * dist,
      ty: Math.sin(angle) * dist,
      rot: Math.random() * 360,
      delay: Math.random() * 120,
    };
  });
}

}

function SHOP_KrasaButik() {
  const [assignment, setAssignment] = useState(() => {
    const words = SHOP_shuffle(SHOP_WORDS);
    const map = {};
    SHOP_ITEMS.forEach((item, i) => {
      map[item.id] = words[i % words.length];
    });
    return map;
  });
  const [purchased, setPurchased] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [filter, setFilter] = useState("alle");
  const [activeId, setActiveId] = useState(null);
  const [listening, setListening] = useState(false);
  const [feedback, setFeedback] = useState(null); // null | "correct" | "wrong" | "error"
  const [heard, setHeard] = useState("");
  const [showHint, setShowHint] = useState(false);
  const [manualMode, setManualMode] = useState(false);
  const [manualText, setManualText] = useState("");
  const [fw, setFw] = useState(null);
  const [motivationQuote, setMotivationQuote] = useState(null);
  const [purchasesSinceMotivation, setPurchasesSinceMotivation] = useState(0);
  const [hardCelebration, setHardCelebration] = useState(null);
  const hardQuoteRef = useRef(null);
  const lastQuoteRef = useRef(null);
  const recogRef = useRef(null);

  const SpeechRecognitionCtor =
    typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const micSupported = !!SpeechRecognitionCtor;

  useEffect(() => {
    (async () => {
      try {
        const a = await window.storage.get("shop-assignment");
        if (a?.value) setAssignment(JSON.parse(a.value));
      } catch (e) {}
      try {
        const p = await window.storage.get("shop-purchased");
        if (p?.value) setPurchased(JSON.parse(p.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("shop-assignment", JSON.stringify(assignment)).catch(() => {});
  }, [assignment, loaded]);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("shop-purchased", JSON.stringify(purchased)).catch(() => {});
  }, [purchased, loaded]);

  const activeItem = SHOP_ITEMS.find((i) => i.id === activeId);
  const activeWord = activeId ? assignment[activeId] : null;
  const purchasedCount = Object.keys(purchased).length;

  useEffect(() => {
    if (loaded && purchasedCount === SHOP_ITEMS.length && purchasedCount > 0) {
      HUB_markLessonCompleted("shop", "Крамниця", "shop");
    }
  }, [purchasedCount, loaded]);

  const visibleItems = useMemo(
    () => (filter === "alle" ? SHOP_ITEMS : SHOP_ITEMS.filter((i) => i.category === filter)),
    [filter]
  );

  function openItem(id) {
    if (purchased[id]) return;
    setActiveId(id);
    setFeedback(null);
    setHeard("");
    setShowHint(false);
    setManualMode(false);
    setManualText("");
    setFw(null);
  }

  function closeModal() {
    setActiveId(null);
    setListening(false);
    if (recogRef.current) {
      try {
        recogRef.current.stop();
      } catch (e) {}
    }
  }

  function handleCorrect() {
    setFeedback("correct");
    setFw(SHOP_buildSparkles());
    HUB_bumpDailyCorrect(1);
    if (SHOP_isHardWord(activeWord)) {
      let hardPick = SHOP_HARD_WORD_QUOTES[Math.floor(Math.random() * SHOP_HARD_WORD_QUOTES.length)];
      if (SHOP_HARD_WORD_QUOTES.length > 1) {
        while (hardPick === hardQuoteRef.current) {
          hardPick = SHOP_HARD_WORD_QUOTES[Math.floor(Math.random() * SHOP_HARD_WORD_QUOTES.length)];
        }
      }
      hardQuoteRef.current = hardPick;
      setHardCelebration(hardPick);
    }
    setPurchasesSinceMotivation((c) => {
      const nc = c + 1;
      if (nc >= 3) {
        let pick = SHOP_MOTIVATION_QUOTES[Math.floor(Math.random() * SHOP_MOTIVATION_QUOTES.length)];
        if (SHOP_MOTIVATION_QUOTES.length > 1) {
          while (pick === lastQuoteRef.current) {
            pick = SHOP_MOTIVATION_QUOTES[Math.floor(Math.random() * SHOP_MOTIVATION_QUOTES.length)];
          }
        }
        lastQuoteRef.current = pick;
        setTimeout(() => setMotivationQuote(pick), 1000);
        return 0;
      }
      return nc;
    });
    setTimeout(() => {
      setPurchased((p) => ({ ...p, [activeId]: true }));
      setActiveId(null);
      setFw(null);
    }, 950);
  }

  const [errorDetail, setErrorDetail] = useState("");

  function startListening() {
    if (!micSupported || !activeWord) return;
    setFeedback(null);
    setHeard("");
    setErrorDetail("");
    const recog = new SpeechRecognitionCtor();
    recog.lang = "uk-UA";
    recog.continuous = false;
    recog.interimResults = false;
    recog.maxAlternatives = 5;
    recog.onstart = () => setListening(true);
    recog.onerror = (e) => {
      setListening(false);
      setFeedback("error");
      setErrorDetail(e?.error || "unbekannt");
    };
    recog.onend = () => setListening(false);
    recog.onresult = (e) => {
      const alts = Array.from(e.results[0] || []).map((r) => r.transcript);
      setHeard(alts[0] || "");
      const ok = alts.some((a) => SHOP_matchesWord(a, activeWord.ua));
      if (ok) {
        handleCorrect();
      } else {
        setFeedback("wrong");
      }
    };
    recogRef.current = recog;
    try {
      recog.start();
    } catch (e) {
      setFeedback("error");
      setErrorDetail(e?.message || "unbekannt");
    }
  }

  function checkManual() {
    if (!activeWord) return;
    if (SHOP_matchesWord(manualText, activeWord.ua)) {
      handleCorrect();
    } else {
      setFeedback("wrong");
      setHeard(manualText);
    }

        @keyframes shakeX {
          0%, 100% { transform: translateX(0); }
          20% { transform: translateX(-6px); }
          40% { transform: translateX(6px); }
          60% { transform: translateX(-4px); }
          80% { transform: translateX(4px); }
        }
        @keyframes pulseRing {
          0% { box-shadow: 0 0 0 0 rgba(198,147,106,0.55); }
          100% { box-shadow: 0 0 0 22px rgba(198,147,106,0); }
        }
      `}</style>

      <SHOP_MotivationOverlay quote={motivationQuote} onDismiss={() => setMotivationQuote(null)} />
      <SHOP_HardWordWaterfall quote={hardCelebration} onDismiss={() => setHardCelebration(null)} />

      <div className="w-full max-w-md">
        {/* Header */}
        <div className="flex items-center justify-between mb-1">
          <h1 className="text-3xl font-serif tracking-tight" style={{ color: "#2B1D15" }}>
            Крамниця
          </h1>
          <div
            className="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-sans"
            style={{ backgroundColor: "#F8EFDF", color: "#C9936A" }}
          >
            <ShoppingBag size={13} />
            {purchasedCount} / {SHOP_ITEMS.length}
          </div>
        </div>
        <p className="text-sm font-sans mb-5" style={{ color: "#7A5A3E" }}>
          Sprich das ukrainische Wort richtig aus, um den Artikel zu bekommen.
        </p>

        {/* Category filter */}
        <div
          className="flex items-center rounded-full p-1 mb-5"
          style={{ backgroundColor: "#F8EFDF" }}
          role="group"
          aria-label="Kategorie wählen"
        >
          {[
            { key: "alle", label: "Alles" },
            { key: "kleidung", label: "Kleidung" },
            { key: "schmuck", label: "Schmuck" },

                color: filter === tab.key ? "#E7D5B4" : "#7A5A3E",

        </div>

        {/* Grid */}
        <div className="grid grid-cols-2 gap-3">
          {visibleItems.map((item) => {

                  style={{ backgroundColor: bought ? "#E4EEDD" : "#D9BD93", color: bought ? "#4A6B3D" : "#C9936A" }}
                >
                  {bought ? <Check size={18} /> : <Icon size={18} />}
                </div>
                <div className="font-serif text-[15px]" style={{ color: "#2B1D15" }}>
                  {item.name}
                </div>
                <div className="text-[11px] mt-1 font-sans" style={{ color: bought ? "#4A6B3D" : "#7A5A3E" }}>
                  {bought ? "Erworben" : "Antippen zum Kaufen"}
                </div>
              </button>
            );
          })}
        </div>

        {!micSupported && (
          <p className="text-xs mt-5 font-sans" style={{ color: "#7A5A3E" }}>
            Spracherkennung wird in diesem Browser nicht unterstützt. Du kannst das Wort stattdessen eintippen.
          </p>
        )}
      </div>

      {/* Modal */}
      {activeItem && activeWord && (
        <div
          className="fixed inset-0 flex items-center justify-center px-4 z-50"
          style={{ backgroundColor: "rgba(58,38,28,0.72)" }}
        >
          <div
            className="relative w-full max-w-sm rounded-xl p-6"
            style={{ backgroundColor: "#F8EFDF", border: "1px solid #C2A278" }}
          >
            <button
              onClick={closeModal}
              className="absolute top-4 right-4 rounded-full p-1.5 focus:outline-none focus:ring-2"
              style={{ color: "#7A5A3E" }}
              aria-label="Schließen"
            >
              <X size={18} />
            </button>

            <div className="text-xs font-sans uppercase tracking-wide mb-1" style={{ color: "#7A5A3E" }}>
              {activeItem.name}
            </div>
            <div className="text-xs font-sans mb-5" style={{ color: "#C9936A" }}>
              Sprich dieses Wort:
            </div>

            <div
              className="relative rounded-lg p-6 mb-5 text-center"
              style={{
                backgroundColor: "#E7D5B4",
                animation: feedback === "wrong" ? "shakeX 400ms ease-in-out" : undefined,
              }}
            >
              <p className="font-serif text-4xl" style={{ color: "#2B1D15" }}>
                {activeWord.ua}
              </p>
              <button
                onClick={() => SHOP_speakUkrainian(activeWord.ua)}
                className="mt-3 inline-flex items-center gap-1.5 text-xs font-sans rounded-full px-3 py-1.5 focus:outline-none focus:ring-2"
                style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}
              >
                <Volume2 size={13} /> Anhören
              </button>
              <SHOP_SparkleBurst particles={fw} />
            </div>

            {showHint ? (
              <p className="text-xs font-sans text-center mb-5" style={{ color: "#7A5A3E" }}>
                Bedeutung: {activeWord.de}
              </p>
            ) : (
              <button
                onClick={() => setShowHint(true)}
                className="block mx-auto text-xs font-sans mb-5 underline underline-offset-2"
                style={{ color: "#7A5A3E" }}
              >
                Bedeutung anzeigen
              </button>
            )}

            {feedback === "correct" && (
              <div className="flex items-center justify-center gap-2 text-sm font-sans mb-4" style={{ color: "#4A6B3D" }}>
                <Check size={16} /> Perfekt ausgesprochen!
              </div>
            )}
            {feedback === "wrong" && (
              <div className="text-center mb-4">
                <div className="flex items-center justify-center gap-2 text-sm font-sans" style={{ color: "#A15347" }}>
                  <X size={16} /> Das war noch nicht ganz richtig.
                </div>
                {heard && (
                  <div className="text-xs font-sans mt-1" style={{ color: "#7A5A3E" }}>
                    Verstanden: „{heard}"
                  </div>
                )}
              </div>
            )}
            {feedback === "error" && (
              <div className="text-xs font-sans text-center mb-4" style={{ color: "#A15347" }}>
                Mikrofon konnte nicht gestartet werden. Prüfe die Berechtigung oder tippe das Wort ein.
                {errorDetail && <div className="mt-1 font-mono" style={{ color: "#7A5A3E" }}>Fehlercode: {errorDetail}</div>}
              </div>
            )}

            {!manualMode ? (
              <>
                <button
                  onClick={startListening}
                  disabled={!micSupported || listening}
                  className="w-full flex items-center justify-center gap-2 rounded-lg py-4 text-sm font-sans font-medium transition-opacity hover:opacity-90 focus:outline-none focus:ring-2 disabled:opacity-50"
                  style={{
                    backgroundColor: "#C9936A",
                    color: "#E7D5B4",
                    animation: listening ? "pulseRing 1.1s ease-out infinite" : undefined,
                  }}
                >
                  <Mic size={18} /> {listening ? "Ich höre zu..." : feedback === "wrong" ? "Nochmal versuchen" : "Sprechen"}
                </button>
                {!micSupported && (
                  <div className="text-xs font-sans text-center mt-2" style={{ color: "#A15347" }}>
                    Spracherkennung ist in diesem Browser nicht verfügbar.
                  </div>
                )}
                <button
                  onClick={() => setManualMode(true)}
                  className="block mx-auto text-xs font-sans mt-4 underline underline-offset-2"
                  style={{ color: "#7A5A3E" }}
                >
                  Stattdessen eintippen
                </button>
              </>
            ) : (
              <div>
                <input
                  autoFocus
                  value={manualText}
                  onChange={(e) => setManualText(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && checkManual()}
                  placeholder="Wort eingeben..."
                  className="w-full rounded-lg py-3 px-4 text-sm font-sans mb-3 focus:outline-none focus:ring-2"
                  style={{ backgroundColor: "#E7D5B4", color: "#2B1D15", border: "1px solid #C2A278" }}
                />
                <button
                  onClick={checkManual}
                  className="w-full rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-90 focus:outline-none focus:ring-2"
                  style={{ backgroundColor: "#C9936A", color: "#E7D5B4" }}
                >
                  Prüfen
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function STORY_speak(text) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "uk-UA";
    u.rate = 0.95;
    synth.speak(u);
  } catch (e) {}
}

function STORY_buildFirework() {
  return Array.from({ length: 20 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 20 + Math.random() * 0.25;
    const dist = 60 + Math.random() * 85;
    return {
      id: i,
      tx: Math.cos(angle) * dist,
      ty: Math.sin(angle) * dist,
      rot: Math.random() * 90 - 45,
      delay: Math.random() * 100,
      size: 12 + Math.random() * 12,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function STORY_Quiz({ story, onFinish, onBack }) {
  const [index, setIndex] = useState(0);
  const [choice, setChoice] = useState(null);
  const [score, setScore] = useState(0);
  const [fw, setFw] = useState(null);

  const question = story.questions[index];

  function pick(i) {
    if (choice !== null) return;
    setChoice(i);
    const correct = i === question.correct;
    if (correct) {
      setScore((s) => s + 1);
      HUB_bumpDailyCorrect(1);
      setFw(STORY_buildFirework());
    }
    setTimeout(() => {
      setFw(null);
      if (index + 1 >= story.questions.length) {
        onFinish(correct ? score + 1 : score);
      } else {
        setIndex((idx) => idx + 1);
        setChoice(null);
      }
    }, 1000);
  }

  return (
    <div>
      <style>{`@keyframes storyPop { 0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0);} 65%{opacity:1;} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.1) rotate(var(--rot));} }`}</style>
      <div className="flex items-center justify-between mb-4">
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>
        <span className="text-xs font-mono" style={{ color: "#7A5A3E" }}>
          {index + 1} / {story.questions.length}
        </span>
      </div>

      <div className="relative rounded-xl p-6 overflow-visible" style={{ backgroundColor: "#F8EFDF" }}>
        <p className="text-[11px] font-sans uppercase tracking-wide mb-3" style={{ color: "#7A5A3E" }}>
          {story.title}
        </p>
        <p className="font-serif text-lg leading-snug" style={{ color: "#2B1D15" }}>
          {question.q}
        </p>
        {fw && (
          <div className="absolute inset-0 pointer-events-none overflow-visible flex items-center justify-center">
            {fw.map((p) => (
              <span
                key={p.id}
                className="absolute"
                style={{ "--tx": `${p.tx}px`, "--ty": `${p.ty}px`, "--rot": `${p.rot}deg`, animation: `storyPop 850ms ease-out forwards`, animationDelay: `${p.delay}ms`, color: p.color }}
              >
                <Star size={p.size} fill={p.color} />
              </span>
            ))}
          </div>
        )}
      </div>

      <div className="flex flex-col gap-2.5 mt-4">
        {question.options.map((opt, i) => {
          let bg = "#F8EFDF";
          let color = "#2B1D15";
          if (choice !== null) {
            if (i === question.correct) {
              bg = "#E4EEDD";
              color = "#4A6B3D";
            } else if (i === choice) {
              bg = "#F5E0DD";
              color = "#A15347";
            }
          }
          return (
            <button
              key={i}
              onClick={() => pick(i)}
              disabled={choice !== null}
              className="text-left rounded-lg py-3 px-4 text-sm font-sans transition-colors focus:outline-none focus:ring-2"
              style={{ backgroundColor: bg, color }}
            >
              {opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

const TEST_NUMBER_DE = {
  1: "eins", 2: "zwei", 3: "drei", 4: "vier", 5: "fünf",
  6: "sechs", 7: "sieben", 8: "acht", 9: "neun", 10: "zehn",

function TEST_normalize(s) {
  return (s || "")
    .toLowerCase()
    .trim()
    .replace(/^(der|die|das|den|dem|des)\s+/i, "")
    .replace(/['’ʼ`]/g, "")
    .replace(/[.,!?;:]/g, "")
    .replace(/\s+/g, " ");
}

function TEST_levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}

function TEST_checkAnswer(input, deField) {
  const a = TEST_normalize(input);
  if (!a) return false;
  const alternatives = deField.split(",").map((s) => TEST_normalize(s));
  return alternatives.some((alt) => {
    if (a === alt) return true;
    const threshold = Math.max(1, Math.round(alt.length * 0.2));
    return TEST_levenshtein(a, alt) <= threshold;
  });
}

function TEST_shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function TEST_Question({ item, direction, index, total, onAnswered, onBack }) {
  const [answer, setAnswer] = useState("");
  const [revealed, setRevealed] = useState(false);
  const [correct, setCorrect] = useState(false);
  const [fw, setFw] = useState(null);
  const isUaDe = direction === "ua-de";
  const prompt = isUaDe ? item.ua : item.de;
  const target = isUaDe ? item.de : item.ua;

  function check() {
    const ok = TEST_checkAnswer(answer, target);
    setCorrect(ok);
    setRevealed(true);
    if (ok) {
      HUB_bumpDailyCorrect(1);
      setFw(STORY_buildFirework());
    }
  }

  function next() {
    onAnswered(correct);
    setAnswer("");
    setRevealed(false);
    setCorrect(false);
    setFw(null);
  }

  return (
    <div>
      <style>{`@keyframes storyPop { 0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0);} 65%{opacity:1;} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.1) rotate(var(--rot));} }`}</style>
      <div className="flex items-center justify-between mb-4">
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Abbrechen
        </button>
        <span className="text-xs font-mono" style={{ color: "#7A5A3E" }}>
          {index + 1} / {total}
        </span>
      </div>

      <div className="relative rounded-xl p-6 text-center overflow-visible" style={{ backgroundColor: "#F8EFDF" }}>
        <p className="text-[11px] font-sans uppercase tracking-wide mb-3" style={{ color: "#7A5A3E" }}>
          {isUaDe ? "Übersetze ins Deutsche" : "Перекладіть українською"}
        </p>
        <p className="font-serif text-3xl mb-5" style={{ color: "#2B1D15" }}>
          {prompt}
        </p>
        {fw && (
          <div className="absolute inset-0 pointer-events-none overflow-visible flex items-center justify-center">
            {fw.map((p) => (
              <span
                key={p.id}
                className="absolute"
                style={{ "--tx": `${p.tx}px`, "--ty": `${p.ty}px`, "--rot": `${p.rot}deg`, animation: `storyPop 850ms ease-out forwards`, animationDelay: `${p.delay}ms`, color: p.color }}
              >
                <Star size={p.size} fill={p.color} />
              </span>
            ))}
          </div>
        )}

        <input
          autoFocus
          value={answer}
          onChange={(e) => setAnswer(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && (revealed ? next() : check())}
          disabled={revealed}
          placeholder="Deine Antwort..."
          className="w-full rounded-lg py-3 px-4 text-base font-sans mb-4 text-center focus:outline-none focus:ring-2 disabled:opacity-70"
          style={{ backgroundColor: "#E7D5B4", color: "#2B1D15", border: "1px solid #C2A278" }}
        />

        {!revealed ? (
          <button
            onClick={check}
            disabled={!answer.trim()}
            className="w-full rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-90 focus:outline-none focus:ring-2 disabled:opacity-40"
            style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
          >
            Prüfen
          </button>
        ) : (
          <div>
            <div
              className="flex items-center justify-center gap-2 rounded-lg px-4 py-2.5 mb-3 text-sm font-sans font-medium"
              style={{
                backgroundColor: correct ? "rgba(107,158,120,0.15)" : "rgba(192,90,90,0.15)",
                color: correct ? "#4A6B3D" : "#A15347",
              }}
            >
              {correct ? (
                <>
                  <Check size={16} /> Richtig!
                </>
              ) : (
                <>
                  <X size={16} /> Richtig wäre: {target}
                </>
              )}
            </div>
            <button
              onClick={next}
              className="w-full rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-90 focus:outline-none focus:ring-2"
              style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
            >
              Weiter
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function TEST_Results({ score, total, wrongList, onRetry, onBack }) {
  const good = score >= Math.ceil(total * 0.7);
  return (
    <div className="rounded-xl p-8 text-center" style={{ backgroundColor: "#F8EFDF" }}>
      <div
        className="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4"

        {good ? "Starkes Ergebnis!" : "Übung macht den Meister — probier's nochmal."}
      </p>

      {wrongList.length > 0 && (
        <div className="mt-5 text-left rounded-lg p-4" style={{ backgroundColor: "#E7D5B4" }}>

          style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}

          Themen
        </button>
      </div>
    </div>
  );
}

function TEST_App() {
  const [screen, setScreen] = useState("themes"); // themes | test | results
  const [themeId, setThemeId] = useState(null);
  const [direction, setDirection] = useState("ua-de");
  const [words, setWords] = useState([]);
  const [index, setIndex] = useState(0);
  const [score, setScore] = useState(0);
  const [wrongList, setWrongList] = useState([]);

  function startTest(id) {
    const theme = TEST_THEMES.find((t) => t.id === id);
    const pool = theme.getPool();
    const picked = TEST_shuffle(pool).slice(0, Math.min(15, pool.length));
    setThemeId(id);
    setWords(picked);
    setIndex(0);
    setScore(0);
    setWrongList([]);
    setScreen("test");
  }

  function handleAnswered(correct, item) {
    if (correct) {
      setScore((s) => s + 1);
      HUB_bumpDailyCorrect(1);
    } else setWrongList((w) => [...w, item]);

    if (index + 1 >= words.length) {
      setScreen("results");
      const theme = TEST_THEMES.find((t) => t.id === themeId);
      HUB_markLessonCompleted(`test-${themeId}`, `Тест: ${theme ? theme.title : themeId}`, "test");
    } else {
      setIndex((i) => i + 1);
    }
  }

  const current = words[index];

  return (
    <div className="min-h-screen w-full flex justify-center px-4 py-8" style={{ backgroundColor: "#E7D5B4" }}>
      <div className="w-full max-w-md">
        {screen === "themes" && (
          <TEST_ThemePicker direction={direction} setDirection={setDirection} onPick={startTest} />
        )}

        {screen === "test" && current && (
          <TEST_Question
            item={current}
            direction={direction}
            index={index}
            total={words.length}
            onAnswered={(correct) => handleAnswered(correct, current)}
            onBack={() => setScreen("themes")}
          />
        )}

        {screen === "results" && (
          <TEST_Results
            score={score}
            total={words.length}
            wrongList={wrongList}
            onRetry={() => startTest(themeId)}
            onBack={() => setScreen("themes")}
          />
        )}
      </div>
    </div>
  );
}

function VERB_isHardWord(word) {

function VERB_HardWordWaterfall({ quote, onDismiss }) {
  if (!quote) return null;
  const stars = Array.from({ length: 26 }).map((_, i) => ({
    id: i,
    left: Math.random() * 100,
    delay: Math.random() * 700,
    duration: 1600 + Math.random() * 900,
    size: 12 + Math.random() * 14,
    rotate: Math.random() * 360,
    color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",

  return (
    <div className="fixed inset-0 z-50" style={{ backgroundColor: "rgba(58,38,28,0.55)" }} onClick={onDismiss}>
      <style>{`
        @keyframes verbFallDown {
          0%   { opacity: 0; transform: translateY(-10vh) rotate(0deg); }
          8%   { opacity: 1; }
          100% { opacity: 0.9; transform: translateY(115vh) rotate(var(--rot)); }
        }
      `}</style>
      <div className="absolute inset-0 overflow-hidden pointer-events-none">
        {stars.map((s) => (
          <span
            key={s.id}
            className="absolute"
            style={{
              left: `${s.left}%`,
              top: 0,
              color: s.color,
              "--rot": `${s.rotate}deg`,
              animation: `verbFallDown ${s.duration}ms linear forwards`,
              animationDelay: `${s.delay}ms`,
            }}
          >
            <Star size={s.size} fill={s.color} />
          </span>
        ))}
      </div>
      <div className="flex items-center justify-center h-full px-6">
        <div
          className="w-full max-w-xs rounded-xl p-6 text-center"
          style={{ backgroundColor: "#F8EFDF", border: "1px solid #C2A278" }}
          onClick={(e) => e.stopPropagation()}

          <div
            className="w-10 h-10 rounded-full flex items-center justify-center mx-auto mb-4"
            style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}
          >
            <Star size={18} fill="#D4AF37" />

function VERB_shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function VERB_speak(text) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "uk-UA";
    u.rate = 0.9;
    synth.speak(u);
  } catch (e) {}
}

function VERB_normalize(s) {
  return (s || "")
    .toLowerCase()
    .trim()
    .replace(/['’ʼ`]/g, "")
    .replace(/[.,!?;:]/g, "")
    .replace(/\s+/g, " ");
}

function VERB_levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}

function VERB_checkConjugation(input, target) {
  const a = VERB_normalize(input);
  const t = VERB_normalize(target);
  if (!a) return false;
  if (a === t) return true;
  const threshold = Math.max(1, Math.round(t.length * 0.15));
  return VERB_levenshtein(a, t) <= threshold;
}

function VERB_buildMegaFirework() {
  return Array.from({ length: 90 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 90 + (Math.random() - 0.5) * 0.6;
    const distance = 120 + Math.random() * 260;
    return {
      id: i,
      tx: Math.cos(angle) * distance,
      ty: Math.sin(angle) * distance,
      rot: Math.random() * 360,
      delay: Math.random() * 500,
      size: 16 + Math.random() * 24,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function VERB_Round({ size, direction, onBack }) {
  const [queue, setQueue] = useState(() => VERB_shuffle(VERB_LIST).slice(0, Math.min(size, VERB_LIST.length)));
  const [flipped, setFlipped] = useState(false);
  const [stage, setStage] = useState("card"); // card | conjugate | done
  const [answer, setAnswer] = useState("");
  const [conjResult, setConjResult] = useState(null); // null | "correct" | "wrong"
  const [fw, setFw] = useState(null);
  const [megaFw, setMegaFw] = useState(null);
  const [megaActive, setMegaActive] = useState(false);
  const [pendingVerb, setPendingVerb] = useState(null);
  const [hardCelebration, setHardCelebration] = useState(null);
  const hardQuoteRef = useRef(null);
  const total = Math.min(size, VERB_LIST.length);

  const current = queue[0];

  function markKnown(correct) {
    const verb = queue[0];
    setQueue((q) => {
      const rest = q.slice(1);
      if (correct) return rest;
      const insertAt = Math.min(rest.length, 2 + Math.floor(Math.random() * 3));
      const requeued = [...rest];
      requeued.splice(insertAt, 0, verb);
      return requeued;
    });
    setFlipped(false);
    if (correct) {
      HUB_bumpDailyCorrect(1);
      if (VERB_isHardWord(verb)) {
        let pick = VERB_HARD_WORD_QUOTES[Math.floor(Math.random() * VERB_HARD_WORD_QUOTES.length)];
        if (VERB_HARD_WORD_QUOTES.length > 1) {
          while (pick === hardQuoteRef.current) {
            pick = VERB_HARD_WORD_QUOTES[Math.floor(Math.random() * VERB_HARD_WORD_QUOTES.length)];
          }
        }
        hardQuoteRef.current = pick;
        setHardCelebration(pick);
      }
      setPendingVerb(verb);
      setAnswer("");
      setConjResult(null);
      setStage("conjugate");
    }
  }

  function checkConjugation() {
    const target = pendingVerb.ua3;
    const ok = VERB_checkConjugation(answer, target);
    setConjResult(ok ? "correct" : "wrong");
    if (ok) {
      HUB_bumpDailyCorrect(1);
      setFw(VERB_buildFwSmall());
    }
  }

  function continueAfterConjugation() {
    setFw(null);
    setStage("card");
    setPendingVerb(null);
    if (queue.length === 0) {
      const mega = VERB_buildMegaFirework();
      setMegaFw(mega);
      setMegaActive(true);
      setStage("done");
      HUB_markLessonCompleted("verb", "Дієслова", "cards");
    }
  }

  return (
    <div>
      <VERB_MegaFireworkOverlay active={megaActive} particles={megaFw || []} onDismiss={() => setMegaActive(false)} />
      <VERB_HardWordWaterfall quote={hardCelebration} onDismiss={() => setHardCelebration(null)} />

      {stage === "card" && current && VERB_isHardWord(current) && (

      {stage === "card" && current && (

          <div className="relative">
            <button

              style={{ backgroundColor: "#F8EFDF" }}
            >
              {!flipped ? (
                <>
                  <p className="font-serif text-3xl" style={{ color: "#2B1D15" }}>{direction === "ua-de" ? current.ua : current.de}</p>
                  <p className="text-xs mt-4 font-sans flex items-center gap-1" style={{ color: "#7A5A3E" }}>
                    <RotateCw size={12} /> Antippen zum Umdrehen
                  </p>
                </>
              ) : (
                <>
                  <p className="font-serif text-2xl" style={{ color: "#D4AF37" }}>{direction === "ua-de" ? current.de : current.ua}</p>
                </>
              )}
            </button>
            {flipped && (
              <button
                onClick={(e) => { e.stopPropagation(); VERB_speak(current.ua); }}
                className="absolute top-3 right-3 rounded-full p-2 transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"

              style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}

      )}

function VERB_buildFwSmall() {
  return Array.from({ length: 16 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 16 + Math.random() * 0.25;
    const dist = 55 + Math.random() * 70;
    return {
      id: i,
      tx: Math.cos(angle) * dist,
      ty: Math.sin(angle) * dist,
      rot: Math.random() * 90 - 45,
      delay: Math.random() * 90,
      size: 10 + Math.random() * 10,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function VERB_App() {
  const [screen, setScreen] = useState("menu"); // menu | round
  const [size, setSize] = useState(25);
  const [direction, setDirection] = useState("ua-de");

  return (
    <div className="min-h-screen w-full flex justify-center px-4 py-8" style={{ backgroundColor: "#E7D5B4" }}>
      <div className="w-full max-w-md">
        {screen === "menu" && (
          <VERB_Menu
            direction={direction}
            setDirection={setDirection}
            onStart={(n) => {
              setSize(n);
              setScreen("round");
            }}
          />
        )}
        {screen === "round" && (
          <VERB_Round key={size + direction} size={size} direction={direction} onBack={() => setScreen("menu")} />
        )}
      </div>
    </div>
  );
}

  const stars = Array.from({ length: 26 }).map((_, i) => ({
    id: i,
    left: Math.random() * 100,
    delay: Math.random() * 700,

function TOPIC_shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const SENTENCE_POOL = (() => {
  const fromVT = VT_SEED_WORDS.map((w) => w.example).filter(Boolean);
  const fromWW = WW_SEED_WORDS.map((w) => w.example).filter(Boolean);
  const fromTopics = TOPIC_CATEGORIES.flatMap((c) => c.words.map((w) => ({ ua: w.exUa, de: w.exDe })));
  const all = [...fromVT, ...fromWW, ...fromTopics].filter((e) => e && e.ua && e.de);
  const seen = new Set();
  const unique = [];
  all.forEach((e) => {
    if (!seen.has(e.ua)) {
      seen.add(e.ua);
      unique.push(e);
    }
  });
  return unique.filter((e) => {
    const wc = e.ua.trim().split(/\s+/).length;
    return wc >= 3 && wc <= 9;
  });
})();

function SENTENCE_pickRound(excludeUa) {
  let pool = SENTENCE_POOL;
  if (excludeUa && pool.length > 1) pool = pool.filter((e) => e.ua !== excludeUa);
  const sentence = pool[Math.floor(Math.random() * pool.length)];
  const tokens = TOPIC_shuffle(sentence.ua.trim().split(/\s+/)).map((t, i) => ({ id: `${i}-${t}-${Math.random()}`, text: t }));
  return { sentence, tokens };
}

function SENTENCE_buildFirework() {
  return Array.from({ length: 20 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 20 + Math.random() * 0.25;
    const dist = 60 + Math.random() * 85;
    return {
      id: i,
      tx: Math.cos(angle) * dist,
      ty: Math.sin(angle) * dist,
      rot: Math.random() * 90 - 45,
      delay: Math.random() * 100,
      size: 12 + Math.random() * 12,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function SENTENCE_Firework({ particles }) {
  if (!particles) return null;
  return (
    <div className="absolute inset-0 pointer-events-none overflow-visible flex items-center justify-center">
      {particles.map((p) => (
        <span
          key={p.id}
          className="absolute"
          style={{ "--tx": `${p.tx}px`, "--ty": `${p.ty}px`, "--rot": `${p.rot}deg`, animation: `sentencePop 850ms ease-out forwards`, animationDelay: `${p.delay}ms`, color: p.color }}
        >
          <Star size={p.size} fill={p.color} />
        </span>
      ))}
    </div>
  );
}

function TOPIC_speak(text) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "uk-UA";
    u.rate = 0.9;
    synth.speak(u);
  } catch (e) {}
}

function TOPIC_CardsMode({ topic, direction, onBack }) {
  const [queue, setQueue] = useState(() => TOPIC_shuffle(topic.words));
  const [flipped, setFlipped] = useState(false);
  const [fw, setFw] = useState(null);
  const [done, setDone] = useState(false);
  const [doneFw, setDoneFw] = useState(null);
  const [hardCelebration, setHardCelebration] = useState(null);
  const hardQuoteRef = useRef(null);
  const total = topic.words.length;
  const item = queue[0];
  const isUaDe = direction === "ua-de";
  const front = item ? (isUaDe ? item.ua : item.de) : "";
  const back = item ? (isUaDe ? item.de : item.ua) : "";

  useEffect(() => {
    if (queue.length === 0 && !done) {
      setDoneFw(TOPIC_buildFirework());
      setDone(true);
      HUB_markLessonCompleted(topic.id, topic.title, "cards");
    }
  }, [queue, done]);

  function toggleFlip() {
    setFlipped((f) => !f);
  }

  function markKnown(correct) {
    const card = queue[0];
    setQueue((q) => {
      const rest = q.slice(1);
      if (correct) return rest;
      const insertAt = Math.min(rest.length, 2 + Math.floor(Math.random() * 3));
      const requeued = [...rest];
      requeued.splice(insertAt, 0, card);
      return requeued;
    });
    setFlipped(false);
    if (correct) {
      HUB_bumpDailyCorrect(1);
      setFw(TOPIC_buildFirework());
      setTimeout(() => setFw(null), 850);
      if (TOPIC_isHardWord(card)) {
        let pick = TOPIC_HARD_WORD_QUOTES[Math.floor(Math.random() * TOPIC_HARD_WORD_QUOTES.length)];
        if (TOPIC_HARD_WORD_QUOTES.length > 1) {
          while (pick === hardQuoteRef.current) {
            pick = TOPIC_HARD_WORD_QUOTES[Math.floor(Math.random() * TOPIC_HARD_WORD_QUOTES.length)];
          }
        }
        hardQuoteRef.current = pick;
        setHardCelebration(pick);
      }
    } else {
      setFw(null);
    }
  }

  const styleTag = (
    <style>{`
      @keyframes topicPop {
        0%   { opacity: 1; transform: translate(0,0) scale(0.5) rotate(0deg); }
        65%  { opacity: 1; }
        100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot)); }
      }
    `}</style>
  );

  if (done) {
    return (
      <div>
        {styleTag}
        <div className="flex items-center justify-between mb-4">
          <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans" style={{ color: "#7A5A3E" }}>
            <ChevronLeft size={16} /> Zurück
          </button>
        </div>
        <div className="relative rounded-xl p-8 text-center overflow-visible" style={{ backgroundColor: "#F8EFDF" }}>
          <TOPIC_Firework particles={doneFw} />
          <p className="font-serif text-2xl" style={{ color: "#D4AF37" }}>
            Runde geschafft!
          </p>
          <p className="text-sm mt-2 font-sans" style={{ color: "#7A5A3E" }}>
            Du kennst jetzt alle {total} Wörter dieser Runde.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div>
      {styleTag}
      <TOPIC_HardWordWaterfall quote={hardCelebration} onDismiss={() => setHardCelebration(null)} />
      <div className="flex items-center justify-between mb-4">

            style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}

            <Volume2 size={16} />
          </button>
        )}

      <div className="flex gap-3 mt-4">
        <button
          onClick={() => markKnown(false)}
          className="flex-1 rounded-lg py-3 text-sm font-sans font-medium border transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
          style={{ borderColor: "#C2A278", color: "#2B1D15" }}

        </button>
        <button
          onClick={() => markKnown(true)}
          className="flex-1 flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"

function TOPIC_buildQuizRound(topic) {
  const target = topic.words[Math.floor(Math.random() * topic.words.length)];
  const distractorPool = topic.words.filter((w) => w.ua !== target.ua);
  const distractors = TOPIC_shuffle(distractorPool).slice(0, 3);
  const options = TOPIC_shuffle([target, ...distractors]);
  return { target, options };
}

function TOPIC_QuizMode({ topic, direction, onBack }) {
  const [round, setRound] = useState(() => TOPIC_buildQuizRound(topic));
  const [choice, setChoice] = useState(null);
  const [fw, setFw] = useState(null);
  const isUaDe = direction === "ua-de";

  function pick(opt) {
    if (choice) return;
    setChoice(opt);
    if (opt.ua === round.target.ua) {
      HUB_bumpDailyCorrect(1);
      setFw(TOPIC_buildFirework());
      setTimeout(() => {
        setFw(null);
        setRound(TOPIC_buildQuizRound(topic));
        setChoice(null);
      }, 900);
    }
  }

  return (
    <div>
      <style>{`
        @keyframes topicPop {
          0%   { opacity: 1; transform: translate(0,0) scale(0.5) rotate(0deg); }
          65%  { opacity: 1; }
          100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot)); }
        }
      `}</style>
      <div className="flex items-center justify-between mb-4">
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>
      </div>

      <div className="relative rounded-xl p-8 mb-4 text-center" style={{ backgroundColor: "#F8EFDF" }}>
        <p className="text-xs font-sans uppercase tracking-wide mb-3" style={{ color: "#7A5A3E" }}>
          {isUaDe ? "Was bedeutet das?" : "Як це буде українською?"}
        </p>
        <p className="font-serif text-3xl" style={{ color: "#2B1D15" }}>{isUaDe ? round.target.ua : round.target.de}</p>
        <TOPIC_Firework particles={fw} />
      </div>

      <div className="flex flex-col gap-2.5">
        {round.options.map((opt) => {
          const isChoice = choice && choice.ua === opt.ua;
          const isCorrectOpt = choice && opt.ua === round.target.ua;
          let bg = "#F8EFDF";
          let color = "#2B1D15";
          if (choice && isCorrectOpt) {
            bg = "#E4EEDD";
            color = "#4A6B3D";
          } else if (isChoice && !isCorrectOpt) {
            bg = "#F5E0DD";
            color = "#A15347";
          }
          return (
            <button
              key={opt.ua}
              onClick={() => pick(opt)}
              disabled={!!choice}
              className="text-left rounded-lg py-3 px-4 text-sm font-sans transition-colors focus:outline-none focus:ring-2"
              style={{ backgroundColor: bg, color }}
            >
              {isUaDe ? opt.de : opt.ua}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function TOPIC_SpeakMode({ topic, direction, onBack }) {
  const [queue, setQueue] = useState(() => TOPIC_shuffle(topic.words));
  const [feedback, setFeedback] = useState(null); // "correct" | "wrong" | "error" | null
  const [heard, setHeard] = useState("");
  const [listening, setListening] = useState(false);
  const [fw, setFw] = useState(null);
  const [done, setDone] = useState(false);
  const total = topic.words.length;
  const item = queue[0];
  const isUaDe = direction === "ua-de";
  const prompt = item ? (isUaDe ? item.ua : item.de) : "";
  const target = item ? (isUaDe ? item.de : item.ua) : "";
  const speakLang = isUaDe ? "de-DE" : "uk-UA";

  const SpeechRecognitionCtor =
    typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const micSupported = !!SpeechRecognitionCtor;
  const recogRef = useRef(null);

  useEffect(() => {
    if (queue.length === 0 && !done) {
      setFw(TOPIC_buildFirework());
      setDone(true);
      HUB_markLessonCompleted(topic.id, topic.title, "speak");
    }
  }, [queue, done]);

  function advance(correct) {
    const card = queue[0];
    setQueue((q) => {
      const rest = q.slice(1);
      if (correct) return rest;
      const insertAt = Math.min(rest.length, 2 + Math.floor(Math.random() * 3));
      const requeued = [...rest];
      requeued.splice(insertAt, 0, card);
      return requeued;
    });
    setFeedback(null);
    setHeard("");
  }

  function startListening() {
    if (!micSupported || !item) return;
    setFeedback(null);
    setHeard("");
    const recog = new SpeechRecognitionCtor();
    recog.lang = speakLang;
    recog.continuous = false;
    recog.interimResults = false;
    recog.maxAlternatives = 5;
    recog.onstart = () => setListening(true);
    recog.onerror = (e) => {
      setListening(false);
      setFeedback("error");
    };
    recog.onend = () => setListening(false);
    recog.onresult = (e) => {
      const alts = Array.from(e.results[0] || []).map((r) => r.transcript);
      setHeard(alts[0] || "");
      const ok = alts.some((a) => SHOP_matchesWord(a, target));
      if (ok) {
        HUB_bumpDailyCorrect(1);
        setFeedback("correct");
        setFw(TOPIC_buildFirework());
        setTimeout(() => {
          setFw(null);
          advance(true);
        }, 900);
      } else {
        setFeedback("wrong");
      }
    };
    recogRef.current = recog;
    try {
      recog.start();
    } catch (e) {
      setFeedback("error");
    }
  }

  const styleTag = (
    <style>{`
      @keyframes topicPop {
        0%   { opacity: 1; transform: translate(0,0) scale(0.5) rotate(0deg); }
        65%  { opacity: 1; }
        100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot)); }
      }
    `}</style>
  );

  if (done) {
    return (
      <div>
        {styleTag}
        <div className="flex items-center justify-between mb-4">
          <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans" style={{ color: "#7A5A3E" }}>
            <ChevronLeft size={16} /> Zurück
          </button>
        </div>
        <div className="relative rounded-xl p-8 text-center overflow-visible" style={{ backgroundColor: "#F8EFDF" }}>
          <TOPIC_Firework particles={fw} />
          <p className="font-serif text-2xl" style={{ color: "#D4AF37" }}>Runde geschafft!</p>
          <p className="text-sm mt-2 font-sans" style={{ color: "#7A5A3E" }}>Alle {total} Wörter richtig ausgesprochen.</p>
        </div>
      </div>
    );
  }

  if (!micSupported) {
    return (
      <div>
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans mb-4" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>
        <div className="rounded-xl p-6 text-center" style={{ backgroundColor: "#F8EFDF" }}>
          <p className="font-sans text-sm" style={{ color: "#2B1D15" }}>
            Diese Aussprache-Übung braucht Spracherkennung, die dieser Browser leider nicht unterstützt.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div>
      {styleTag}
      <div className="flex items-center justify-between mb-4">
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>
        <span className="text-xs font-mono" style={{ color: "#7A5A3E" }}>
          Noch {queue.length} von {total}
        </span>
      </div>

      <div className="relative rounded-xl p-8 mb-4 text-center overflow-visible" style={{ backgroundColor: "#F8EFDF" }}>
        <p className="text-xs font-sans uppercase tracking-wide mb-3" style={{ color: "#7A5A3E" }}>
          Sprich die Übersetzung
        </p>
        <p className="font-serif text-3xl" style={{ color: "#2B1D15" }}>{prompt}</p>
        <TOPIC_Firework particles={fw} />
      </div>

      <button
        onClick={startListening}
        disabled={listening}
        className="w-full flex items-center justify-center gap-2 rounded-lg py-4 text-sm font-sans font-medium transition-opacity hover:opacity-90 focus:outline-none focus:ring-2 disabled:opacity-60"
        style={{ backgroundColor: listening ? "#C9936A" : "#2F5EA8", color: "#F8EFDF" }}
      >
        <Mic size={18} /> {listening ? "Ich höre zu…" : "Antippen und sprechen"}
      </button>

      {feedback && (
        <div
          className="flex items-center justify-center gap-2 rounded-lg px-4 py-3 mt-4 text-sm font-sans font-medium"
          style={{
            backgroundColor: feedback === "correct" ? "#E4EEDD" : feedback === "wrong" ? "#F5E0DD" : "#EAD2C0",
            color: feedback === "correct" ? "#4A6B3D" : feedback === "wrong" ? "#A15347" : "#7A5A3E",
          }}
        >
          {feedback === "correct" && <><Check size={16} /> Richtig ausgesprochen!</>}
          {feedback === "wrong" && (
            <span>
              Das war „{heard || "…"}" — richtig wäre <strong>{target}</strong>.
            </span>
          )}
          {feedback === "error" && <span>Mikrofon konnte nicht starten. Prüfe die Berechtigung.</span>}
        </div>
      )}

      {feedback === "wrong" && (
        <button
          onClick={() => advance(false)}
          className="w-full mt-3 rounded-lg py-3 text-sm font-sans font-medium border transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
          style={{ borderColor: "#C2A278", color: "#2B1D15" }}
        >
          Weiter (später nochmal)
        </button>
      )}
    </div>
  );
}

          </button>

        <div className="flex items-start gap-2.5 rounded-lg p-3.5 mt-5" style={{ backgroundColor: "#EAD2C0" }}>
          <Lightbulb size={16} color="#D4AF37" className="shrink-0 mt-0.5" />
          {mnemo ? (
            <p className="text-xs font-sans leading-relaxed" style={{ color: "#5A4331" }}>{mnemo}</p>
          ) : (
            <p className="text-xs font-sans italic leading-relaxed" style={{ color: "#9C8577" }}>

            </p>
          )}
        </div>
      </div>

      <div className="flex gap-3 mt-4">
        <button
          onClick={() => setIndex((i) => Math.max(0, i - 1))}
          disabled={index === 0}
          className="flex-1 flex items-center justify-center gap-1 rounded-lg py-3 text-sm font-sans font-medium border transition-opacity hover:opacity-85 focus:outline-none focus:ring-2 disabled:opacity-40"
          style={{ borderColor: "#C2A278", color: "#2B1D15" }}
        >
          <ChevronLeft size={15} /> Zurück
        </button>
        {!isLast ? (
          <button
            onClick={() => setIndex((i) => Math.min(total - 1, i + 1))}
            className="flex-1 flex items-center justify-center gap-1 rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
            style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}

        ) : (
          <button
            onClick={onGoToCards}
            className="flex-1 rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
            style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
          >
            Zu Картки →
          </button>
        )}
      </div>
    </div>
  );
}

function TOPIC_App() {
  const [screen, setScreen] = useState("picker"); // picker | modes | learn | cards | quiz | speak
  const [topic, setTopic] = useState(null);
  const [direction, setDirection] = useState("ua-de");

  return (
    <div className="min-h-screen w-full flex justify-center px-4 py-8" style={{ backgroundColor: "#E7D5B4" }}>
      <div className="w-full max-w-md">
        {screen === "picker" && (
          <TOPIC_Picker
            direction={direction}
            setDirection={setDirection}
            onPick={(t) => {
              setTopic(t);
              setScreen("modes");
            }}
          />
        )}
        {screen === "modes" && topic && (
          <TOPIC_ModePicker topic={topic} onMode={setScreen} onBack={() => setScreen("picker")} />
        )}
        {screen === "learn" && topic && (
          <TOPIC_LearnMode topic={topic} direction={direction} onBack={() => setScreen("modes")} onGoToCards={() => setScreen("cards")} />
        )}
        {screen === "cards" && topic && <TOPIC_CardsMode topic={topic} direction={direction} onBack={() => setScreen("modes")} />}
        {screen === "quiz" && topic && <TOPIC_QuizMode topic={topic} direction={direction} onBack={() => setScreen("modes")} />}
        {screen === "speak" && topic && <TOPIC_SpeakMode topic={topic} direction={direction} onBack={() => setScreen("modes")} />}
      </div>
    </div>
  );
}

      },

  },
  {
    id: "street",
    title: "На вулиці",
    subtitle: "Auf der Straße",
    icon: Compass,
    turns: [
      {
        npc: "Вибачте, як пройти до центру міста?",
        npcDe: "Entschuldigung, wie komme ich ins Stadtzentrum?",
        promptDe: "Sag z. B.: „Прямо і наліво“",
        accept: ["прямо", "наліво", "направо", "туди"],
      },
      {
        npc: "Дякую! А це далеко звідси?",
        npcDe: "Danke! Ist das weit von hier?",
        promptDe: "Antworte: „Ні, близько“ oder „Так, далеко“",
        accept: ["близько", "далеко", "недалеко"],
      },
      {
        npc: "Як у тебе справи сьогодні?",
        npcDe: "Wie geht es dir heute?",
        promptDe: "Sag: „Добре, дякую! А в тебе?“",
        accept: ["добре", "дякую", "чудово", "нормально"],
      },
      {
        npc: "Гарна сьогодні погода, чи не так?",
        npcDe: "Schönes Wetter heute, nicht wahr?",
        promptDe: "Antworte: „Так, дуже гарна“",
        accept: ["так", "гарна", "дійсно"],
      },
      {

        accept: ["дякую", "до побачення", "до зустрічі", "взаємно"],
      },
    ],
  },
];

function TALK_normalize(s) {
  return (s || "")
    .toLowerCase()
    .trim()
    .replace(/['’ʼ`]/g, "")
    .replace(/[.,!?;:]/g, "")
    .replace(/\s+/g, " ");
}

function TALK_levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}

function TALK_matches(transcript, acceptList) {
  const t = TALK_normalize(transcript);
  if (!t) return false;
  return acceptList.some((phrase) => {
    const p = TALK_normalize(phrase);
    if (t.includes(p)) return true;
    // fuzzy: check each word of the phrase appears close enough somewhere in transcript
    const words = t.split(" ");
    return words.some((w) => TALK_levenshtein(w, p) <= Math.max(1, Math.round(p.length * 0.25)));
  });
}

function TALK_speak(text) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "uk-UA";
    u.rate = 0.92;
    synth.speak(u);
  } catch (e) {}
}

function TALK_buildFirework() {
  return Array.from({ length: 18 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.25;
    const dist = 55 + Math.random() * 70;
    return {
      id: i,
      tx: Math.cos(angle) * dist,
      ty: Math.sin(angle) * dist,
      rot: Math.random() * 90 - 45,
      delay: Math.random() * 90,
      size: 11 + Math.random() * 11,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function TALK_Firework({ particles }) {
  if (!particles) return null;
  return (
    <div className="absolute inset-0 pointer-events-none overflow-visible flex items-center justify-center">
      {particles.map((p) => (
        <span
          key={p.id}
          className="absolute"
          style={{ "--tx": `${p.tx}px`, "--ty": `${p.ty}px`, "--rot": `${p.rot}deg`, animation: `talkPop 850ms ease-out forwards`, animationDelay: `${p.delay}ms`, color: p.color }}
        >
          <Star size={p.size} fill={p.color} />
        </span>
      ))}
    </div>
  );
}

function TALK_ScenarioPicker({ onPick }) {
  const [completedIds, setCompletedIds] = useState([]);

  useEffect(() => {
    (async () => {
      const list = await HUB_getCompletedLessons();
      const today = HUB_todayISO();
      setCompletedIds(list.filter((e) => e.date === today).map((e) => e.topicId));
    })();
  }, []);

  return (
    <div>
      <h1 className="text-3xl font-serif tracking-tight" style={{ color: "#2B1D15" }}>
        Розмовник
      </h1>
      <p className="text-sm mt-1 font-sans" style={{ color: "#7A5A3E" }}>
        Übe echte Gespräche — deine Antworten sprichst du laut.
      </p>
      <div className="flex flex-col gap-3 mt-6">
        {TALK_SCENARIOS.map((s) => {
          const Icon = s.icon;
          const isDone = completedIds.includes(`talk-${s.id}`);
          return (
            <button
              key={s.id}
              onClick={() => onPick(s)}
              className="flex items-center gap-4 rounded-xl p-4 text-left transition-transform hover:scale-[1.01] focus:outline-none focus:ring-2"
              style={{ backgroundColor: "#F8EFDF", border: isDone ? "1.5px solid #4A6B3D" : "1.5px solid transparent" }}
            >
              <div className="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}>
                <Icon size={20} />
              </div>
              <div className="min-w-0 flex-1">
                <div className="font-serif text-lg flex items-center gap-2" style={{ color: "#2B1D15" }}>
                  {s.title}
                  {isDone && (
                    <span
                      className="flex items-center gap-1 text-[10px] font-sans font-medium uppercase tracking-wide rounded-full px-2 py-0.5"
                      style={{ backgroundColor: "#E4EEDD", color: "#4A6B3D" }}
                    >
                      <Check size={10} /> Heute erledigt
                    </span>
                  )}
                </div>
                <div className="text-xs font-sans mt-0.5" style={{ color: "#7A5A3E" }}>{s.subtitle} · {s.turns.length} Repliken</div>
              </div>
              <ChevronRight size={18} color="#7A5A3E" />
            </button>
          );
        })}
      </div>
    </div>
  );
}

function TALK_Conversation({ scenario, onBack }) {
  const [turnIndex, setTurnIndex] = useState(0);
  const [history, setHistory] = useState([]); // { npc, userText } for completed turns
  const [feedback, setFeedback] = useState(null); // "correct" | "wrong" | "error" | null
  const [heard, setHeard] = useState("");
  const [listening, setListening] = useState(false);
  const [fw, setFw] = useState(null);
  const [done, setDone] = useState(false);
  const [attempts, setAttempts] = useState(0);

  const turn = scenario.turns[turnIndex];

  const SpeechRecognitionCtor =
    typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const micSupported = !!SpeechRecognitionCtor;

  useEffect(() => {
    if (turn) TALK_speak(turn.npc);
  }, [turnIndex]);

  function startListening() {
    if (!micSupported || !turn) return;
    setFeedback(null);
    setHeard("");
    const recog = new SpeechRecognitionCtor();
    recog.lang = "uk-UA";
    recog.continuous = false;
    recog.interimResults = false;
    recog.maxAlternatives = 5;
    recog.onstart = () => setListening(true);
    recog.onerror = () => {
      setListening(false);
      setFeedback("error");
    };
    recog.onend = () => setListening(false);
    recog.onresult = (e) => {
      const alts = Array.from(e.results[0] || []).map((r) => r.transcript);
      const bestGuess = alts[0] || "";
      setHeard(bestGuess);
      const ok = alts.some((a) => TALK_matches(a, turn.accept));
      if (ok) {
        HUB_bumpDailyCorrect(1);
        setFeedback("correct");
        setFw(TALK_buildFirework());
        setTimeout(() => {
          setFw(null);
          setHistory((h) => [...h, { npc: turn.npc, npcDe: turn.npcDe, userText: bestGuess }]);
          setAttempts(0);
          if (turnIndex + 1 >= scenario.turns.length) {
            setDone(true);
            HUB_markLessonCompleted(`talk-${scenario.id}`, scenario.title, "talk");
          } else {
            setTurnIndex((i) => i + 1);
          }
          setFeedback(null);
          setHeard("");
        }, 900);
      } else {
        setFeedback("wrong");
        setAttempts((a) => a + 1);
      }
    };
    try {
      recog.start();
    } catch (e) {
      setFeedback("error");
    }
  }

  function skipTurn() {
    setHistory((h) => [...h, { npc: turn.npc, npcDe: turn.npcDe, userText: null }]);
    setAttempts(0);
    setFeedback(null);
    setHeard("");
    if (turnIndex + 1 >= scenario.turns.length) {
      setDone(true);
      HUB_markLessonCompleted(`talk-${scenario.id}`, scenario.title, "talk");
    } else {
      setTurnIndex((i) => i + 1);
    }
  }

  const styleTag = (
    <style>{`
      @keyframes talkPop {
        0%   { opacity: 1; transform: translate(0,0) scale(0.5) rotate(0deg); }
        65%  { opacity: 1; }
        100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot)); }
      }
    `}</style>
  );

  if (done) {
    return (
      <div>
        {styleTag}
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans mb-4" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>
        <div className="rounded-xl p-8 text-center" style={{ backgroundColor: "#F8EFDF" }}>
          <div className="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4" style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}>
            <Trophy size={22} />
          </div>
          <p className="font-serif text-2xl" style={{ color: "#D4AF37" }}>Розмова завершена!</p>
          <p className="text-sm mt-2 font-sans" style={{ color: "#7A5A3E" }}>
            Du hast das ganze Gespräch „{scenario.title}“ gemeistert.
          </p>
        </div>
      </div>
    );
  }

  if (!micSupported) {
    return (
      <div>
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans mb-4" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>
        <div className="rounded-xl p-6 text-center" style={{ backgroundColor: "#F8EFDF" }}>
          <p className="font-sans text-sm" style={{ color: "#2B1D15" }}>
            Der Gesprächssimulator braucht Spracherkennung, die dieser Browser leider nicht unterstützt.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div>
      {styleTag}
      <div className="flex items-center justify-between mb-4">
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>
        <span className="text-xs font-mono" style={{ color: "#7A5A3E" }}>
          {turnIndex + 1} / {scenario.turns.length}
        </span>
      </div>

      {history.length > 0 && (
        <div className="flex flex-col gap-2 mb-4 max-h-40 overflow-y-auto">
          {history.slice(-3).map((h, i) => (
            <div key={i} className="text-xs font-sans">
              <p style={{ color: "#7A5A3E" }}>💬 {h.npc}</p>
              {h.userText && <p style={{ color: "#4A6B3D" }}>→ {h.userText}</p>}
            </div>
          ))}
        </div>
      )}

      <div className="relative rounded-xl p-6 mb-3 overflow-visible" style={{ backgroundColor: "#F8EFDF" }}>
        <div className="flex items-start justify-between gap-2">
          <div>
            <p className="text-[11px] font-sans uppercase tracking-wide mb-2" style={{ color: "#7A5A3E" }}>
              {scenario.title}
            </p>
            <p className="font-serif text-xl leading-snug" style={{ color: "#2B1D15" }}>{turn.npc}</p>
            <p className="text-xs font-sans italic mt-2" style={{ color: "#9C8577" }}>{turn.npcDe}</p>
          </div>
          <button
            onClick={() => TALK_speak(turn.npc)}
            className="rounded-full p-2 shrink-0 transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
            style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}
            title="Nochmal anhören"
          >
            <Volume2 size={16} />
          </button>
        </div>
        <TALK_Firework particles={fw} />
      </div>

      <div className="rounded-lg p-3 mb-3 text-xs font-sans" style={{ backgroundColor: "#EAD2C0", color: "#7A5A3E" }}>
        {turn.promptDe}
      </div>

      <button
        onClick={startListening}
        disabled={listening}
        className="w-full flex items-center justify-center gap-2 rounded-lg py-4 text-sm font-sans font-medium transition-opacity hover:opacity-90 focus:outline-none focus:ring-2 disabled:opacity-60"
        style={{ backgroundColor: listening ? "#C9936A" : "#2F5EA8", color: "#F8EFDF" }}
      >
        <Mic size={18} /> {listening ? "Ich höre zu…" : "Antippen und antworten"}
      </button>

      {feedback && (
        <div
          className="flex items-center justify-center gap-2 rounded-lg px-4 py-3 mt-4 text-sm font-sans font-medium text-center"
          style={{
            backgroundColor: feedback === "correct" ? "#E4EEDD" : feedback === "wrong" ? "#F5E0DD" : "#EAD2C0",
            color: feedback === "correct" ? "#4A6B3D" : feedback === "wrong" ? "#A15347" : "#7A5A3E",
          }}
        >
          {feedback === "correct" && <><Check size={16} /> Passt!</>}
          {feedback === "wrong" && <span>Ich habe „{heard || "…"}" verstanden — versuch's nochmal.</span>}
          {feedback === "error" && <span>Mikrofon konnte nicht starten. Prüfe die Berechtigung.</span>}
        </div>
      )}

      {attempts >= 2 && (
        <button
          onClick={skipTurn}
          className="w-full mt-3 rounded-lg py-3 text-sm font-sans font-medium border transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
          style={{ borderColor: "#C2A278", color: "#2B1D15" }}
        >
          Weiter zur nächsten Replik
        </button>
      )}
    </div>
  );
}

function TALK_App() {
  const [scenario, setScenario] = useState(null);

  return (
    <div className="min-h-screen w-full flex justify-center px-4 py-8" style={{ backgroundColor: "#E7D5B4" }}>
      <div className="w-full max-w-md">
        {!scenario && <TALK_ScenarioPicker onPick={setScenario} />}
        {scenario && <TALK_Conversation scenario={scenario} onBack={() => setScenario(null)} />}
      </div>
    </div>
  );
}
