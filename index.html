<script>
  // Ersatz für die Claude-Artefakt-Speicherfunktion, hier auf Basis von localStorage
  window.storage = {
    get: function (key) {
      return Promise.resolve().then(function () {
        var v = localStorage.getItem(key);
        return v === null ? null : { key: key, value: v };
      });
    },
    set: function (key, value) {
      return Promise.resolve().then(function () {
        localStorage.setItem(key, value);
        return { key: key, value: value };
      });
    },
    delete: function (key) {
      return Promise.resolve().then(function () {
        localStorage.removeItem(key);
        return { key: key, deleted: true };
      });
    },
    list: function (prefix) {
      return Promise.resolve().then(function () {
        var keys = Object.keys(localStorage).filter(function (k) {
          return !prefix || k.indexOf(prefix) === 0;
        });
        return { keys: keys };
      });
    },
  };
</script>

const HUB_DAILY_KEY = "hub-daily-correct";
const HUB_HISTORY_KEY = "hub-history";

function HUB_todayISO() {
  return new Date().toISOString().slice(0, 10);
}

let HUB_dailyCache = null; // { date, count } | null — hält den aktuellen Stand unabhängig vom Speicher-API

async function HUB_getDailyStats() {
  if (HUB_dailyCache && HUB_dailyCache.date === HUB_todayISO()) {
    return HUB_dailyCache;
  }
  try {
    const r = await window.storage.get(HUB_DAILY_KEY);
    if (r?.value) {
      const parsed = JSON.parse(r.value);
      if (parsed.date === HUB_todayISO()) {
        HUB_dailyCache = parsed;
        return parsed;
      }
    }
  } catch (e) {}
  HUB_dailyCache = { date: HUB_todayISO(), count: 0 };
  return HUB_dailyCache;
}

let HUB_bumpQueue = Promise.resolve();

async function HUB_bumpDailyCorrect(n = 1) {
  HUB_bumpQueue = HUB_bumpQueue.then(async () => {
    const cur = await HUB_getDailyStats();
    const next = { date: cur.date, count: cur.count + n };
    HUB_dailyCache = next; // sofort sichtbar, unabhängig vom Speicher-API-Erfolg

    try {
      await window.storage.set(HUB_DAILY_KEY, JSON.stringify(next));

      let history = {};
      try {
        const h = await window.storage.get(HUB_HISTORY_KEY);
        if (h?.value) history = JSON.parse(h.value);
      } catch (e) {}
      history[next.date] = (history[next.date] || 0) + n;
      await window.storage.set(HUB_HISTORY_KEY, JSON.stringify(history));
    } catch (e) {}

    return next;
  });
  return HUB_bumpQueue;
}

function HUB_weekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = (d.getDay() + 6) % 7; // 0 = Montag
  const monday = new Date(d);
  monday.setDate(d.getDate() - day);
  return monday.toISOString().slice(0, 10);
}

function HUB_weekLabel(weekKey) {
  const start = new Date(weekKey + "T00:00:00");
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  const fmt = (d) => `${d.getDate()}.${d.getMonth() + 1}.`;
  return `${fmt(start)} – ${fmt(end)}`;
}

async function HUB_getWeeklyStats() {
  try {
    const h = await window.storage.get(HUB_HISTORY_KEY);
    const history = h?.value ? JSON.parse(h.value) : {};
    const weekTotals = {};
    Object.entries(history).forEach(([date, count]) => {
      const wk = HUB_weekKey(date);
      weekTotals[wk] = (weekTotals[wk] || 0) + count;
    });
    const weeks = Object.entries(weekTotals).map(([wk, total]) => ({
      weekKey: wk,
      label: HUB_weekLabel(wk),
      total,
      isCurrent: wk === HUB_weekKey(HUB_todayISO()),
    }));
    weeks.sort((a, b) => b.total - a.total);
    return weeks;
  } catch (e) {
    return [];
  }
}

const HUB_COMPLETED_KEY = "hub-completed-lessons";

let HUB_completedCache = null;

async function HUB_getCompletedLessons() {
  if (HUB_completedCache) return HUB_completedCache;
  try {
    const r = await window.storage.get(HUB_COMPLETED_KEY);
    HUB_completedCache = r?.value ? JSON.parse(r.value) : [];
  } catch (e) {
    HUB_completedCache = [];
  }
  return HUB_completedCache;
}

let HUB_completedQueue = Promise.resolve();

async function HUB_markLessonCompleted(topicId, topicTitle, mode) {
  HUB_completedQueue = HUB_completedQueue.then(async () => {
    const list = await HUB_getCompletedLessons();
    const today = HUB_todayISO();
    const already = list.some((e) => e.topicId === topicId && e.date === today);
    if (!already) {
      const next = [...list, { topicId, topicTitle, date: today, mode }];
      HUB_completedCache = next;
      try {
        await window.storage.set(HUB_COMPLETED_KEY, JSON.stringify(next));
      } catch (e) {}
    }
  });
  return HUB_completedQueue;
}

async function HUB_isCompletedToday(topicId) {
  const list = await HUB_getCompletedLessons();
  const today = HUB_todayISO();
  return list.some((e) => e.topicId === topicId && e.date === today);
}

async function HUB_getCompletedThisWeek() {
  const list = await HUB_getCompletedLessons();
  const thisWeek = HUB_weekKey(HUB_todayISO());
  return list
    .filter((e) => HUB_weekKey(e.date) === thisWeek)
    .sort((a, b) => b.date.localeCompare(a.date));
}

function HUB_getWordOfDay() {
  const pool = [
    ...VT_SEED_WORDS.map((w) => ({ ua: w.ua, de: w.de })),
    ...WW_SEED_WORDS.map((w) => ({ ua: w.ua, de: w.de })),
    ...VERB_LIST.map((v) => ({ ua: v.ua, de: v.de })),
    ...TOPIC_CATEGORIES.flatMap((c) => c.words.map((w) => ({ ua: w.ua, de: w.de }))),
  ];
  if (pool.length === 0) return null;
  const dateStr = HUB_todayISO();
  let hash = 0;
  for (let i = 0; i < dateStr.length; i++) {
    hash = (hash * 31 + dateStr.charCodeAt(i)) >>> 0;
  }
  return pool[hash % pool.length];
}

const HUB_MOOD_KEY = "hub-mood-journal";
const HUB_MOOD_PREFIX = "Сьогодні я почуваюся ";

function MoodJournal({ onBack }) {
  const [text, setText] = useState(HUB_MOOD_PREFIX);
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(HUB_MOOD_KEY);
        const list = r?.value ? JSON.parse(r.value) : [];
        setEntries(list);
        const today = list.find((e) => e.date === HUB_todayISO());
        if (today) setText(today.text);
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  function save() {
    if (text.trim() === HUB_MOOD_PREFIX.trim()) return;
    const today = HUB_todayISO();
    const next = entries.filter((e) => e.date !== today);
    next.unshift({ date: today, text });
    setEntries(next);
    window.storage.set(HUB_MOOD_KEY, JSON.stringify(next.slice(0, 30))).catch(() => {});
    setSaved(true);
    setTimeout(() => setSaved(false), 1800);
  }

  function formatDate(d) {
    const dt = new Date(d + "T00:00:00");
    return `${dt.getDate()}.${dt.getMonth() + 1}.`;
  }

  return (
    <div className="min-h-screen w-full flex justify-center px-4 py-10" style={{ backgroundColor: "#E7D5B4" }}>
      <div className="w-full max-w-md">
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans mb-6" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>

        <h1 className="text-3xl font-serif tracking-tight" style={{ color: "#2B1D15" }}>
          Який у тебе сьогодні настрій?
        </h1>
        <p className="text-sm mt-1 font-sans" style={{ color: "#7A5A3E" }}>
          Wie fühlst du dich heute? Schreib frei — es gibt kein richtig oder falsch.
        </p>
        <EmbroideryDivider className="mt-5 mb-6" />

        <textarea
          value={text}
          onChange={(e) => {
            let v = e.target.value;
            if (!v.startsWith(HUB_MOOD_PREFIX)) v = HUB_MOOD_PREFIX;
            setText(v);
          }}
          rows={4}
          className="w-full rounded-xl p-4 text-base font-sans focus:outline-none focus:ring-2"
          style={{ backgroundColor: "#F8EFDF", color: "#2B1D15", border: "1px solid #C2A278" }}
        />

        <button
          onClick={save}
          disabled={!loaded}
          className="w-full flex items-center justify-center gap-2 rounded-lg py-3.5 text-sm font-sans font-medium mt-3 transition-opacity hover:opacity-90 focus:outline-none focus:ring-2 disabled:opacity-50"
          style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
        >
          {saved ? <><Check size={16} /> Gespeichert</> : "Speichern"}
        </button>

        {entries.length > 0 && (
          <div className="mt-8">
            <p className="text-xs font-sans uppercase tracking-wide mb-3" style={{ color: "#C9936A" }}>
              Bisherige Einträge
            </p>
            <div className="flex flex-col gap-2">
              {entries.map((e, i) => (
                <div key={i} className="rounded-lg p-3" style={{ backgroundColor: "#F8EFDF" }}>
                  <p className="text-[11px] font-sans mb-1" style={{ color: "#9C8577" }}>{formatDate(e.date)}</p>
                  <p className="text-sm font-sans" style={{ color: "#2B1D15" }}>{e.text}</p>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

        {exDe && <p className="text-xs font-sans italic mt-1" style={{ color: "#9C8577" }}>{exDe}</p>}

            </p>
          )}
        </div>
      </div>

      <div className="flex gap-3 mt-4">
        <button
          onClick={() => setIndex((i) => Math.max(0, i - 1))}
          disabled={index === 0}
          className="flex-1 flex items-center justify-center gap-1 rounded-lg py-3 text-sm font-sans font-medium border transition-opacity hover:opacity-85 focus:outline-none focus:ring-2 disabled:opacity-40"
          style={{ borderColor: "#C2A278", color: "#2B1D15" }}
        >
          <ChevronLeft size={15} /> Zurück
        </button>
        {!isLast ? (
          <button
            onClick={() => setIndex((i) => Math.min(total - 1, i + 1))}
            className="flex-1 flex items-center justify-center gap-1 rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
            style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
          >
            Weiter <ChevronRight size={15} />
          </button>
        ) : (
          <button
            onClick={onDone}
            className="flex-1 rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
            style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
          >
            Fertig →
          </button>
        )}
      </div>
    </div>
  );
}

const VT_LEITNER_INTERVAL_DAYS = [0, 1, 3, 7, 16];

function VT_todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function VT_daysBetween(a, b) {
  return Math.floor((new Date(b) - new Date(a)) / 86400000);
}

function VT_newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function VT_shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function VT_speakUkrainian(text) {
  if (!text || typeof window === "undefined" || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "uk-UA";
    const voices = window.speechSynthesis.getVoices();
    const ukVoice = voices.find((v) => v.lang?.toLowerCase().startsWith("uk"));
    if (ukVoice) utterance.voice = ukVoice;
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  } catch (e) {}
}

function VT_buildFireworkParticles() {
  return Array.from({ length: 18 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 18 + (Math.random() - 0.5) * 0.5;
    const distance = 55 + Math.random() * 65;
    return {
      key: i,
      tx: Math.cos(angle) * distance,
      ty: Math.sin(angle) * distance,
      delay: Math.random() * 90,
      size: 10 + Math.random() * 12,
      rotate: Math.random() * 90 - 45,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function VT_buildBigFireworkParticles() {
  return Array.from({ length: 42 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 42 + (Math.random() - 0.5) * 0.5;
    const distance = 90 + Math.random() * 130;
    return {
      key: i,
      tx: Math.cos(angle) * distance,
      ty: Math.sin(angle) * distance,
      delay: Math.random() * 240,
      size: 13 + Math.random() * 17,
      rotate: Math.random() * 90 - 45,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function VT_VocabTrainer() {
  const [words, setWords] = useState(VT_SEED_WORDS);
  const [progress, setProgress] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [screen, setScreen] = useState("home"); // home | flash | quiz | five | add
  const [queue, setQueue] = useState([]);
  const [pos, setPos] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [quizChoice, setQuizChoice] = useState(null);
  const [quizOptions, setQuizOptions] = useState([]);
  const [cardsUntilText, setCardsUntilText] = useState(3);
  const [answeredSinceMotivation, setAnsweredSinceMotivation] = useState(0);
  const [motivationQuote, setMotivationQuote] = useState(null);
  const lastQuoteRef = useRef(null);
  const [sessionDone, setSessionDone] = useState(false);
  const [bigFw, setBigFw] = useState(null);
  const [form, setForm] = useState({ ua: "", infinitive: "", de: "", exUa: "", exDe: "" });
  const [direction, setDirection] = useState("ua-de"); // "ua-de" oder "de-ua"

  // ---- Streak ----
  const [streak, setStreak] = useState(0);
  const [bestStreak, setBestStreak] = useState(0);

  // ---- Tagesziel ----
  const [dailyGoal, setDailyGoal] = useState(10);
  const [dailyDate, setDailyDate] = useState(VT_todayISO());
  const [dailyCorrect, setDailyCorrect] = useState(0);
  const [goalFw, setGoalFw] = useState(null);
  const [goalCelebration, setGoalCelebration] = useState(false);

  // ---- Schwierige/lange Wörter ----
  const [hardCelebration, setHardCelebration] = useState(null); // { quote } | null
  const hardQuoteRef = useRef(null);

  // ---- Load ----
  useEffect(() => {
    (async () => {
      try {
        const w = await window.storage.get("vt-words");
        if (w?.value) setWords(JSON.parse(w.value));
      } catch (e) {}
      try {
        const p = await window.storage.get("vt-progress");
        if (p?.value) setProgress(JSON.parse(p.value));
      } catch (e) {}
      try {
        const d = await window.storage.get("vt-direction");
        if (d?.value) setDirection(d.value);
      } catch (e) {}
      try {
        const bs = await window.storage.get("vt-best-streak");
        if (bs?.value) setBestStreak(JSON.parse(bs.value));
      } catch (e) {}
      try {
        const g = await window.storage.get("vt-daily-goal");
        if (g?.value) setDailyGoal(JSON.parse(g.value));
      } catch (e) {}
      try {
        const dp = await window.storage.get("vt-daily-progress");
        if (dp?.value) {
          const parsed = JSON.parse(dp.value);
          if (parsed.date === VT_todayISO()) {
            setDailyDate(parsed.date);
            setDailyCorrect(parsed.correct);
          } else {
            setDailyDate(VT_todayISO());
            setDailyCorrect(0);
          }
        }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("vt-words", JSON.stringify(words)).catch(() => {});
  }, [words, loaded]);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("vt-progress", JSON.stringify(progress)).catch(() => {});
  }, [progress, loaded]);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("vt-direction", direction).catch(() => {});
  }, [direction, loaded]);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("vt-best-streak", JSON.stringify(bestStreak)).catch(() => {});
  }, [bestStreak, loaded]);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("vt-daily-goal", JSON.stringify(dailyGoal)).catch(() => {});
  }, [dailyGoal, loaded]);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("vt-daily-progress", JSON.stringify({ date: dailyDate, correct: dailyCorrect })).catch(() => {});
  }, [dailyDate, dailyCorrect, loaded]);

  const dueWords = useMemo(() => {
    const t = VT_todayISO();
    return words.filter((w) => {
      const p = progress[w.id];
      if (!p) return true;
      return p.dueDate <= t;
    });
  }, [words, progress]);

  const stats = useMemo(() => {
    const known = Object.values(progress).filter((p) => p.box >= 4).length;
    return { total: words.length, due: dueWords.length, known };
  }, [words, progress, dueWords]);

  function updateBox(id, correct) {
    setProgress((prev) => {
      const cur = prev[id] || { box: 0 };
      const nextBox = correct ? Math.min(cur.box + 1, 4) : 0;
      const days = VT_LEITNER_INTERVAL_DAYS[nextBox];
      const due = new Date();
      due.setDate(due.getDate() + days);
      return { ...prev, [id]: { box: nextBox, dueDate: due.toISOString().slice(0, 10) } };
    });
  }

  function startSession(mode) {
    if (mode === "learn") {
      setScreen("learn");
      return;
    }
    if (mode === "five") {
      const pool = VT_shuffle(words).slice(0, Math.min(5, words.length));
      setQueue(pool);
      setPos(0);
      setFlipped(false);
      setQuizChoice(null);
      setSessionDone(false);
      setBigFw(null);
      setCardsUntilText(99);
      setScreen("five");
      return;
    }
    const pool = dueWords.length > 0 ? dueWords : words;
    setQueue(VT_shuffle(pool));
    setPos(0);
    setFlipped(false);
    setQuizChoice(null);
    setSessionDone(false);
    setBigFw(null);
    setCardsUntilText(3);
    setScreen(mode);
    if (mode === "quiz") buildQuizOptions(VT_shuffle(pool)[0], pool);
  }

  function buildQuizOptions(target, pool) {
    if (!target) return;
    const distractors = VT_shuffle(pool.filter((w) => w.id !== target.id)).slice(0, 3);
    setQuizOptions(VT_shuffle([target, ...distractors]));
  }

  const current = screen === "flash" ? queue[0] : queue[pos];
  const showText = current && cardsUntilText === 0 && current.example;

  function bumpMotivation() {
    setAnsweredSinceMotivation((c) => {
      const nc = c + 1;
      if (nc >= 4) {
        let pick = VT_MOTIVATION_QUOTES[Math.floor(Math.random() * VT_MOTIVATION_QUOTES.length)];
        if (VT_MOTIVATION_QUOTES.length > 1) {
          while (pick === lastQuoteRef.current) {
            pick = VT_MOTIVATION_QUOTES[Math.floor(Math.random() * VT_MOTIVATION_QUOTES.length)];
          }
        }
        lastQuoteRef.current = pick;
        setMotivationQuote(pick);
        return 0;
      }
      return nc;
    });
  }

  function registerAnswer(word, correct) {
    if (!correct) {
      setStreak(0);
      return;
    }
    HUB_bumpDailyCorrect(1);
    setStreak((s) => {
      const ns = s + 1;
      if (ns > bestStreak) setBestStreak(ns);
      return ns;
    });

    const t = VT_todayISO();
    if (dailyDate !== t) {
      setDailyDate(t);
      setDailyCorrect(1);
      if (1 === dailyGoal) {
        setGoalFw(VT_buildBigFireworkParticles());
        setGoalCelebration(true);
      }
    } else {
      setDailyCorrect((c) => {
        const nc = c + 1;
        if (nc === dailyGoal) {
          setGoalFw(VT_buildBigFireworkParticles());
          setGoalCelebration(true);
        }
        return nc;
      });
    }

    if (VT_isHardWord(word)) {
      let pick = VT_HARD_WORD_QUOTES[Math.floor(Math.random() * VT_HARD_WORD_QUOTES.length)];
      if (VT_HARD_WORD_QUOTES.length > 1) {
        while (pick === hardQuoteRef.current) {
          pick = VT_HARD_WORD_QUOTES[Math.floor(Math.random() * VT_HARD_WORD_QUOTES.length)];
        }
      }
      hardQuoteRef.current = pick;
      setHardCelebration(pick);
    }
  }

  // Flash mode: cards you don't know get reshuffled back into the round,
  // so the round only ends once every card has been answered correctly.
  useEffect(() => {
    if (screen === "flash" && queue.length === 0 && !sessionDone) {
      setBigFw(VT_buildBigFireworkParticles());
      setSessionDone(true);
      HUB_markLessonCompleted("vt", "Словниковий тренажер", "flash");
    }
  }, [screen, queue, sessionDone]);

  function handleFlashAnswer(correct) {
    const card = queue[0];
    updateBox(card.id, correct);
    registerAnswer(card, correct);
    setQueue((q) => {
      const rest = q.slice(1);
      if (correct) return rest;
      const insertAt = Math.min(rest.length, 2 + Math.floor(Math.random() * 3));
      const requeued = [...rest];
      requeued.splice(insertAt, 0, card);
      return requeued;
    });
    setFlipped(false);
    if (showText) {
      setCardsUntilText(3);
    } else {
      setCardsUntilText((c) => (c <= 0 ? 3 : c - 1));
    }
    bumpMotivation();
  }

  function skipFlashText() {
    setQueue((q) => q.slice(1));
    setCardsUntilText(3);
    bumpMotivation();
  }

  function nextCard() {
    bumpMotivation();
    if (pos + 1 >= queue.length) {
      setBigFw(VT_buildBigFireworkParticles());
      setSessionDone(true);
      HUB_markLessonCompleted("vt", "Словниковий тренажер", "quiz");
      return;
    }
    const next = pos + 1;
    setPos(next);
    setFlipped(false);
    setQuizChoice(null);
    if (showText) {
      setCardsUntilText(3);
    } else {
      setCardsUntilText((c) => (c <= 0 ? 3 : c - 1));
    }
    if (screen === "quiz") buildQuizOptions(queue[next], queue);
  }

  function handleQuizAnswer(opt) {
    if (quizChoice) return;
    setQuizChoice(opt);
    const correct = opt.id === current.id;
    updateBox(current.id, correct);
    registerAnswer(current, correct);
    setTimeout(nextCard, 900);
  }

  function addWord() {
    if (!form.ua.trim() || !form.de.trim()) return;
    const entry = {
      id: VT_newId(),
      ua: form.ua.trim(),
      infinitive: form.infinitive.trim() || null,
      de: form.de.trim(),
      example:
        form.exUa.trim() && form.exDe.trim()
          ? { ua: form.exUa.trim(), de: form.exDe.trim() }
          : null,
    };
    setWords((w) => [entry, ...w]);
    setForm({ ua: "", infinitive: "", de: "", exUa: "", exDe: "" });
    setScreen("home");
  }

  function deleteWord(id) {
    setWords((w) => w.filter((x) => x.id !== id));
    setProgress((p) => {
      const c = { ...p };
      delete c[id];
      return c;
    });
  }

  // ---- UI helpers ----
  const flagBar = (
    <div className="flex h-1 w-full rounded-full overflow-hidden mb-6">
      <div className="flex-1" style={LACE_BLUE_STYLE} />
      <div className="flex-1" style={LACE_GOLD_STYLE} />
    </div>
  );

  return (
    <div className="min-h-screen w-full flex justify-center px-4 py-8" style={{ backgroundColor: "#E7D5B4" }}>
      <style>{`
        @keyframes correctPop {
          0%   { opacity: 1; transform: translate(0,0) scale(0.5) rotate(0deg); }
          65%  { opacity: 1; }
          100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot)); }
        }
        @keyframes fallDown {
          0%   { opacity: 0; transform: translateY(-10vh) rotate(0deg); }
          8%   { opacity: 1; }
          100% { opacity: 0.9; transform: translateY(115vh) rotate(var(--rot)); }
        }
      `}</style>
      <VT_MotivationOverlay quote={motivationQuote} onDismiss={() => setMotivationQuote(null)} />
      <VT_GoalReachedOverlay active={goalCelebration} particles={goalFw} onDismiss={() => setGoalCelebration(false)} />
      <VT_HardWordWaterfall quote={hardCelebration} onDismiss={() => setHardCelebration(null)} />
      <div className="w-full max-w-md">
        {flagBar}

        {screen === "home" && (
          <VT_Home
            stats={stats}
            words={words}
            direction={direction}
            setDirection={setDirection}
            onStart={startSession}
            onAdd={() => setScreen("add")}
            onManage={() => setScreen("manage")}
            bestStreak={bestStreak}
            dailyGoal={dailyGoal}
            setDailyGoal={setDailyGoal}
            dailyCorrect={dailyDate === VT_todayISO() ? dailyCorrect : 0}
          />
        )}

        {screen === "manage" && (
          <VT_Manage words={words} onDelete={deleteWord} onBack={() => setScreen("home")} />
        )}

        {screen === "add" && (
          <VT_AddWord form={form} setForm={setForm} onSave={addWord} onBack={() => setScreen("home")} />
        )}

        {screen === "learn" && words.length > 0 && (
          <HUB_LearnBrowser
            items={words}
            getFront={(w) => w.ua}
            getBack={(w) => w.de}
            getExampleUa={(w) => w.example?.ua}
            getExampleDe={(w) => w.example?.de}
            getMnemo={(w) => VT_MNEMONICS[w.ua]}
            speakText={(w) => w.ua}
            onBack={() => setScreen("home")}
            onDone={() => setScreen("home")}
          />
        )}

        {(screen === "flash" || screen === "quiz" || screen === "five") && !sessionDone && current && (
          <VT_Session
            mode={screen}
            direction={direction}
            current={current}
            pos={pos}
            total={queue.length}
            remaining={queue.length}
            streak={streak}
            showText={showText}
            flipped={flipped}
            setFlipped={setFlipped}
            quizOptions={quizOptions}
            quizChoice={quizChoice}
            onFlashAnswer={handleFlashAnswer}
            onQuizAnswer={handleQuizAnswer}
            onSkipText={screen === "flash" ? skipFlashText : nextCard}
            onBack={() => setScreen("home")}
          />
        )}

        {(screen === "flash" || screen === "quiz" || screen === "five") && (sessionDone || !current) && (
          <VT_SessionDone particles={bigFw} onBack={() => setScreen("home")} />
        )}
      </div>
    </div>
  );
}

  const [fw, setFw] = useState(null);

    setTimeout(() => setFw(null), 900);

          style={{ backgroundColor: "#F8EFDF" }}

                <RotateCw size={12} /> Antippen zum Umdrehen

            <>
              <p className="font-serif text-2xl" style={{ color: "#D4AF37" }}>

        <button
          onClick={(e) => {
            e.stopPropagation();
            VT_speakUkrainian(word.ua);
          }}
          className="absolute top-3 right-3 rounded-full p-2 transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
          style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}
          aria-label="Ukrainische Aussprache anhören"

          <Volume2 size={16} />

          <button

            className="flex-1 flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-sans font-medium border transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
            style={{ borderColor: "#D9A79E", color: "#A15347" }}

        <VT_CorrectFirework particles={fw} />
      </div>
      <div className="space-y-2">
        {options.map((opt) => {
          const isCorrect = opt.id === word.id;
          const isChoice = choice?.id === opt.id;
          let bg = "#F8EFDF";
          let border = "#C2A278";
          let color = "#2B1D15";
          if (choice) {
            if (isCorrect) {
              bg = "#E4EEDD";
              border = "#4A6B3D";
              color = "#4A6B3D";
            } else if (isChoice) {
              bg = "#F5E0DD";
              border = "#D9A79E";
              color = "#A15347";
            }
          }
          return (
            <button
              key={opt.id}
              onClick={() => handleChoice(opt)}
              disabled={!!choice}
              className="w-full text-left rounded-lg py-3 px-4 text-sm font-sans border transition-colors focus:outline-none focus:ring-2"
              style={{ backgroundColor: bg, borderColor: border, color }}
            >
              {isUaDe ? opt.de : opt.ua}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function VT_SessionDone({ particles, onBack }) {
  return (
    <div className="relative rounded-xl p-8 text-center overflow-visible" style={{ backgroundColor: "#F8EFDF" }}>
      <VT_CorrectFirework particles={particles} />
      <p className="font-serif text-2xl" style={{ color: "#D4AF37" }}>

      <p className="text-sm mt-2 font-sans" style={{ color: "#7A5A3E" }}>

}

      <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans mb-4" style={{ color: "#7A5A3E" }}>

        <VT_Field

          value={form.infinitive}
          onChange={set("infinitive")}
          placeholder="напр. читати"
        />
        <VT_Field label="Deutsche Übersetzung" value={form.de} onChange={set("de")} placeholder="z. B. lesen" />
        <VT_Field
          label="Beispielsatz Ukrainisch (optional)"
          value={form.exUa}
          onChange={set("exUa")}
          placeholder="Я люблю читати книги."
        />

      <button
        onClick={onSave}
        className="w-full mt-6 rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
        style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
      >
        Speichern
      </button>
    </div>
  );
}

function VT_Field({ label, value, onChange, placeholder }) {
  return (
    <div>
      <label className="text-xs font-sans" style={{ color: "#7A5A3E" }}>
        {label}
      </label>
      <input
        value={value}
        onChange={onChange}
        placeholder={placeholder}
        className="w-full mt-1 rounded-lg px-3 py-2.5 text-sm font-sans outline-none focus:ring-2"

function VT_Manage({ words, onDelete, onBack }) {
  return (
    <div>
      <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans mb-4" style={{ color: "#7A5A3E" }}>
        <ChevronLeft size={16} /> Zurück
      </button>
      <h2 className="font-serif text-xl mb-4" style={{ color: "#2B1D15" }}>

      {words.length === 0 ? (
        <p className="text-sm font-sans" style={{ color: "#7A5A3E" }}>

      ) : (
        <ul className="space-y-2">
          {words.map((w) => (
            <li
              key={w.id}
              className="flex items-center justify-between rounded-lg px-4 py-3"
              style={{ backgroundColor: "#F8EFDF" }}

              <div>

const WW_HARD_WORD_MIN_LENGTH = 12;

function WW_isHardWord(word) {
  return !!word && word.ua && word.ua.length >= WW_HARD_WORD_MIN_LENGTH;
}

function WW_HardWordWaterfall({ quote, onDismiss }) {
  if (!quote) return null;
  const stars = Array.from({ length: 26 }).map((_, i) => ({
    id: i,
    left: Math.random() * 100,
    delay: Math.random() * 700,
    duration: 1600 + Math.random() * 900,
    size: 12 + Math.random() * 14,
    rotate: Math.random() * 360,
    color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
  }));

  return (
    <div className="fixed inset-0 z-50" style={{ backgroundColor: "rgba(58,38,28,0.55)" }} onClick={onDismiss}>
      <style>{`
        @keyframes wwFallDown {
          0%   { opacity: 0; transform: translateY(-10vh) rotate(0deg); }
          8%   { opacity: 1; }
          100% { opacity: 0.9; transform: translateY(115vh) rotate(var(--rot)); }
        }
      `}</style>
      <div className="absolute inset-0 overflow-hidden pointer-events-none">
        {stars.map((s) => (
          <span
            key={s.id}
            className="absolute"
            style={{
              left: `${s.left}%`,
              top: 0,
              color: s.color,
              "--rot": `${s.rotate}deg`,
              animation: `wwFallDown ${s.duration}ms linear forwards`,
              animationDelay: `${s.delay}ms`,
            }}
          >
            <Star size={s.size} fill={s.color} />
          </span>
        ))}
      </div>
      <div className="flex items-center justify-center h-full px-6">
        <div
          className="w-full max-w-xs rounded-xl p-6 text-center"
          style={{ backgroundColor: "#F8EFDF", border: "1px solid #C2A278" }}
          onClick={(e) => e.stopPropagation()}
        >
          <div
            className="w-10 h-10 rounded-full flex items-center justify-center mx-auto mb-4"
            style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}
          >
            <Star size={18} fill="#D4AF37" />
          </div>
          <p className="font-serif text-xl" style={{ color: "#2B1D15" }}>
            {quote}
          </p>
          <button
            onClick={onDismiss}
            className="mt-5 rounded-lg px-5 py-2.5 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
            style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
          >
            Weiter
          </button>
        </div>
      </div>
    </div>
  );
}

const WW_LEITNER_INTERVAL_DAYS = [0, 1, 3, 7, 16];

function WW_todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function WW_daysBetween(a, b) {
  return Math.floor((new Date(b) - new Date(a)) / 86400000);
}

function WW_newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function WW_shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function WW_speakUkrainian(text) {
  if (!text || typeof window === "undefined" || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "uk-UA";
    const voices = window.speechSynthesis.getVoices();
    const ukVoice = voices.find((v) => v.lang?.toLowerCase().startsWith("uk"));
    if (ukVoice) utterance.voice = ukVoice;
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  } catch (e) {}
}

function WW_buildFireworkParticles() {
  return Array.from({ length: 18 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 18 + (Math.random() - 0.5) * 0.5;
    const distance = 55 + Math.random() * 65;
    return {
      key: i,
      tx: Math.cos(angle) * distance,
      ty: Math.sin(angle) * distance,
      delay: Math.random() * 90,
      size: 10 + Math.random() * 12,
      rotate: Math.random() * 90 - 45,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function WW_buildBigFireworkParticles() {
  return Array.from({ length: 40 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 40 + (Math.random() - 0.5) * 0.5;
    const distance = 80 + Math.random() * 120;
    return {
      key: i,
      tx: Math.cos(angle) * distance,
      ty: Math.sin(angle) * distance,
      delay: Math.random() * 220,
      size: 12 + Math.random() * 16,
      rotate: Math.random() * 90 - 45,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function WW_CorrectFirework({ particles }) {
  if (!particles) return null;
  return (
    <div className="absolute inset-0 pointer-events-none flex items-center justify-center">
      {particles.map((p) => (
        <Star
          key={p.key}
          size={p.size}
          fill={p.color}
          color={p.color}
          style={{
            position: "absolute",
            "--tx": `${p.tx}px`,
            "--ty": `${p.ty}px`,
            "--rot": `${p.rotate}deg`,
            animation: "correctPop 0.85s ease-out forwards",
            animationDelay: `${p.delay}ms`,
          }}
        />
      ))}
    </div>
  );
}

function WW_VocabTrainer() {
  const [words, setWords] = useState(WW_SEED_WORDS);
  const [progress, setProgress] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [screen, setScreen] = useState("home"); // home | flash | quiz | mix | add
  const [queue, setQueue] = useState([]);
  const [pos, setPos] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [quizChoice, setQuizChoice] = useState(null);
  const [quizOptions, setQuizOptions] = useState([]);
  const [cardsUntilText, setCardsUntilText] = useState(3);
  const [answeredSinceMotivation, setAnsweredSinceMotivation] = useState(0);
  const [motivationQuote, setMotivationQuote] = useState(null);
  const lastQuoteRef = useRef(null);
  const [sessionDone, setSessionDone] = useState(false);
  const [bigFw, setBigFw] = useState(null);
  const [hardCelebration, setHardCelebration] = useState(null);
  const hardQuoteRef = useRef(null);
  const [round10Score, setRound10Score] = useState(0);
  const [round10Quote, setRound10Quote] = useState("");
  const [round10Fw, setRound10Fw] = useState(null);
  const round10QuoteRef = useRef(null);
  const [form, setForm] = useState({ ua: "", infinitive: "", de: "", exUa: "", exDe: "" });
  const [direction, setDirection] = useState("ua-de"); // "ua-de" oder "de-ua"

  // ---- Load ----
  useEffect(() => {
    (async () => {
      try {
        const w = await window.storage.get("vt2-words");
        if (w?.value) setWords(JSON.parse(w.value));
      } catch (e) {}
      try {
        const p = await window.storage.get("vt2-progress");
        if (p?.value) setProgress(JSON.parse(p.value));
      } catch (e) {}
      try {
        const d = await window.storage.get("vt2-direction");
        if (d?.value) setDirection(d.value);
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("vt2-words", JSON.stringify(words)).catch(() => {});
  }, [words, loaded]);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("vt2-progress", JSON.stringify(progress)).catch(() => {});
  }, [progress, loaded]);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("vt2-direction", direction).catch(() => {});
  }, [direction, loaded]);

  const dueWords = useMemo(() => {
    const t = WW_todayISO();
    return words.filter((w) => {
      const p = progress[w.id];
      if (!p) return true;
      return p.dueDate <= t;
    });
  }, [words, progress]);

  const stats = useMemo(() => {
    const known = Object.values(progress).filter((p) => p.box >= 4).length;
    return { total: words.length, due: dueWords.length, known };
  }, [words, progress, dueWords]);

  function updateBox(id, correct) {
    setProgress((prev) => {
      const cur = prev[id] || { box: 0 };
      const nextBox = correct ? Math.min(cur.box + 1, 4) : 0;
      const days = WW_LEITNER_INTERVAL_DAYS[nextBox];
      const due = new Date();
      due.setDate(due.getDate() + days);
      return { ...prev, [id]: { box: nextBox, dueDate: due.toISOString().slice(0, 10) } };
    });
  }

  function startSession(mode) {
    if (mode === "round10") {
      const pool = WW_shuffle(words).slice(0, Math.min(10, words.length));
      setQueue(pool);
      setPos(0);
      setFlipped(false);
      setQuizChoice(null);
      setSessionDone(false);
      setCardsUntilText(3);
      setRound10Score(0);
      setRound10Fw(null);
      setScreen("round10");
      buildQuizOptions(pool[0], words);
      return;
    }
    const pool = mode === "mix" ? words : dueWords.length > 0 ? dueWords : words;
    setQueue(WW_shuffle(pool));
    setPos(0);
    setFlipped(false);
    setQuizChoice(null);
    setSessionDone(false);
    setCardsUntilText(3);
    setScreen(mode);
    if (mode === "quiz") buildQuizOptions(WW_shuffle(pool)[0], pool);
  }

  function buildQuizOptions(target, pool) {
    if (!target) return;
    const distractors = WW_shuffle(pool.filter((w) => w.id !== target.id)).slice(0, 3);
    setQuizOptions(WW_shuffle([target, ...distractors]));
  }

  const current = screen === "flash" ? queue[0] : queue[pos];
  const showText = current && cardsUntilText === 0 && current.example;

  function bumpMotivation() {
    setAnsweredSinceMotivation((c) => {
      const nc = c + 1;
      if (nc >= 4) {
        let pick = WW_MOTIVATION_QUOTES[Math.floor(Math.random() * WW_MOTIVATION_QUOTES.length)];
        if (WW_MOTIVATION_QUOTES.length > 1) {
          while (pick === lastQuoteRef.current) {
            pick = WW_MOTIVATION_QUOTES[Math.floor(Math.random() * WW_MOTIVATION_QUOTES.length)];
          }
        }
        lastQuoteRef.current = pick;
        setMotivationQuote(pick);
        return 0;
      }
      return nc;
    });
  }

  useEffect(() => {
    if (screen === "flash" && queue.length === 0 && !sessionDone) {
      setBigFw(WW_buildBigFireworkParticles());
      setSessionDone(true);
      HUB_markLessonCompleted("ww", "Фрази", "flash");
    }
  }, [screen, queue, sessionDone]);

  function triggerHardWordCelebration(word) {
    if (!WW_isHardWord(word)) return;
    let pick = WW_HARD_WORD_QUOTES[Math.floor(Math.random() * WW_HARD_WORD_QUOTES.length)];
    if (WW_HARD_WORD_QUOTES.length > 1) {
      while (pick === hardQuoteRef.current) {
        pick = WW_HARD_WORD_QUOTES[Math.floor(Math.random() * WW_HARD_WORD_QUOTES.length)];
      }
    }
    hardQuoteRef.current = pick;
    setHardCelebration(pick);
  }

  function handleFlashAnswer(correct) {
    const card = queue[0];
    updateBox(card.id, correct);
    if (correct) {
      HUB_bumpDailyCorrect(1);
      triggerHardWordCelebration(card);
    }
    setQueue((q) => {
      const rest = q.slice(1);
      if (correct) return rest;
      const insertAt = Math.min(rest.length, 2 + Math.floor(Math.random() * 3));
      const requeued = [...rest];
      requeued.splice(insertAt, 0, card);
      return requeued;
    });
    setFlipped(false);
    if (showText) {
      setCardsUntilText(3);
    } else {
      setCardsUntilText((c) => (c <= 0 ? 3 : c - 1));
    }
    bumpMotivation();
  }

  function skipFlashText() {
    setQueue((q) => q.slice(1));
    setCardsUntilText(3);
    bumpMotivation();
  }

  function nextCard() {
    bumpMotivation();
    if (pos + 1 >= queue.length) {
      if (screen === "mix") {
        setQueue(WW_shuffle(words));
        setPos(0);
        setFlipped(false);
        return;
      }
      if (screen === "round10") {
        let pick = WW_ROUND10_QUOTES[Math.floor(Math.random() * WW_ROUND10_QUOTES.length)];
        if (WW_ROUND10_QUOTES.length > 1) {
          while (pick === round10QuoteRef.current) {
            pick = WW_ROUND10_QUOTES[Math.floor(Math.random() * WW_ROUND10_QUOTES.length)];
          }
        }
        round10QuoteRef.current = pick;
        setRound10Quote(pick);
        setRound10Fw(WW_buildBigFireworkParticles());
      }
      setSessionDone(true);
      HUB_markLessonCompleted("ww", "Фрази", "quiz");
      return;
    }
    const next = pos + 1;
    setPos(next);
    setFlipped(false);
    setQuizChoice(null);
    if (showText) {
      setCardsUntilText(3);
    } else {
      setCardsUntilText((c) => (c <= 0 ? 3 : c - 1));
    }
    if (screen === "quiz") buildQuizOptions(queue[next], queue);
    if (screen === "round10") buildQuizOptions(queue[next], words);
  }

  function prevCard() {
    if (screen !== "mix") return;
    setFlipped(false);
    setPos((p) => (p - 1 + queue.length) % queue.length);
  }

  function handleQuizAnswer(opt) {
    if (quizChoice) return;
    setQuizChoice(opt);
    const correct = opt.id === current.id;
    updateBox(current.id, correct);
    if (correct) {
      HUB_bumpDailyCorrect(1);
      triggerHardWordCelebration(current);
    }
    if (screen === "round10" && correct) setRound10Score((s) => s + 1);
    setTimeout(nextCard, 900);
  }

  function addWord() {
    if (!form.ua.trim() || !form.de.trim()) return;
    const entry = {
      id: WW_newId(),
      ua: form.ua.trim(),
      infinitive: form.infinitive.trim() || null,
      de: form.de.trim(),
      example:
        form.exUa.trim() && form.exDe.trim()
          ? { ua: form.exUa.trim(), de: form.exDe.trim() }
          : null,
    };
    setWords((w) => [entry, ...w]);
    setForm({ ua: "", infinitive: "", de: "", exUa: "", exDe: "" });
    setScreen("home");
  }

  function deleteWord(id) {
    setWords((w) => w.filter((x) => x.id !== id));
    setProgress((p) => {
      const c = { ...p };
      delete c[id];
      return c;
    });
  }

  // ---- UI helpers ----
  const flagBar = (
    <div className="flex h-1 w-full rounded-full overflow-hidden mb-6">
      <div className="flex-1" style={LACE_BLUE_STYLE} />
      <div className="flex-1" style={LACE_GOLD_STYLE} />
    </div>
  );

  return (
    <div className="min-h-screen w-full flex justify-center px-4 py-8" style={{ backgroundColor: "#E7D5B4" }}>
      <style>{`
        @keyframes correctPop {
          0%   { opacity: 1; transform: translate(0,0) scale(0.5) rotate(0deg); }
          65%  { opacity: 1; }
          100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot)); }
        }
      `}</style>
      <WW_MotivationOverlay quote={motivationQuote} onDismiss={() => setMotivationQuote(null)} />
      <WW_HardWordWaterfall quote={hardCelebration} onDismiss={() => setHardCelebration(null)} />
      <div className="w-full max-w-md">
        {flagBar}

        {screen === "home" && (
          <WW_Home
            stats={stats}
            words={words}
            direction={direction}
            setDirection={setDirection}
            onStart={startSession}
            onAdd={() => setScreen("add")}
            onManage={() => setScreen("manage")}
            onMemes={() => setScreen("memes")}
          />
        )}

        {screen === "memes" && <WW_MemeMode onBack={() => setScreen("home")} />}

        {screen === "manage" && (
          <WW_Manage words={words} onDelete={deleteWord} onBack={() => setScreen("home")} />
        )}

        {screen === "add" && (
          <WW_AddWord form={form} setForm={setForm} onSave={addWord} onBack={() => setScreen("home")} />
        )}

        {(screen === "flash" || screen === "quiz" || screen === "mix" || screen === "round10") && !sessionDone && current && (
          <WW_Session
            mode={screen === "round10" ? "quiz" : screen}
            direction={direction}
            current={current}
            pos={pos}
            total={queue.length}
            remaining={queue.length}
            showText={showText}
            flipped={flipped}
            setFlipped={setFlipped}
            quizOptions={quizOptions}
            quizChoice={quizChoice}
            onFlashAnswer={handleFlashAnswer}
            onQuizAnswer={handleQuizAnswer}
            onMixNext={nextCard}
            onMixPrev={prevCard}
            onSkipText={screen === "flash" ? skipFlashText : nextCard}
            onBack={() => setScreen("home")}
          />
        )}

        {(screen === "flash" || screen === "quiz") && (sessionDone || !current) && (
          <WW_SessionDone particles={bigFw} onBack={() => setScreen("home")} />
        )}

        {screen === "round10" && sessionDone && (
          <WW_Round10Done
            score={round10Score}
            total={queue.length}
            quote={round10Quote}
            particles={round10Fw}
            onRestart={() => startSession("round10")}
            onBack={() => setScreen("home")}
          />
        )}
      </div>
    </div>
  );
}

function WW_MemeMode({ onBack }) {
  const [queue, setQueue] = useState(() => WW_shuffle(WW_MEMES));
  const [guess, setGuess] = useState("");
  const [revealed, setRevealed] = useState(false);
  const [done, setDone] = useState(false);
  const [fw, setFw] = useState(null);
  const total = WW_MEMES.length;
  const item = queue[0];

  useEffect(() => {
    if (queue.length === 0 && !done) {
      setFw(WW_buildFireworkParticles());
      setDone(true);
    }
  }, [queue, done]);

  function markKnown(correct) {
    const card = queue[0];
    setQueue((q) => {
      const rest = q.slice(1);
      if (correct) return rest;
      const insertAt = Math.min(rest.length, 2 + Math.floor(Math.random() * 3));
      const requeued = [...rest];
      requeued.splice(insertAt, 0, card);
      return requeued;
    });
    setGuess("");
    setRevealed(false);
    if (correct) {
      HUB_bumpDailyCorrect(1);
      setFw(WW_buildFireworkParticles());
      setTimeout(() => setFw(null), 900);
    }
  }

  if (done) {
    return (
      <div>
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans mb-4" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>
        <div className="relative rounded-xl p-8 text-center overflow-visible" style={{ backgroundColor: "#F8EFDF" }}>
          <WW_CorrectFirework particles={fw} />
          <p className="font-serif text-2xl" style={{ color: "#D4AF37" }}>Runde geschafft!</p>
          <p className="text-sm mt-2 font-sans" style={{ color: "#7A5A3E" }}>
            Du kennst jetzt alle {total} Memes dieser Runde.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>
        <span className="text-xs font-mono" style={{ color: "#7A5A3E" }}>
          Noch {queue.length} von {total}
        </span>
      </div>

      <div className="relative rounded-xl p-6 overflow-visible" style={{ backgroundColor: "#F8EFDF" }}>
        <p className="text-[11px] font-sans uppercase tracking-wide mb-2" style={{ color: "#7A5A3E" }}>
          {item.context}
        </p>
        <p className="font-serif text-2xl leading-snug" style={{ color: "#2B1D15" }}>
          {item.phrase}
        </p>
        <WW_CorrectFirework particles={fw} />
      </div>

      {!revealed ? (
        <div className="mt-4">
          <textarea
            value={guess}
            onChange={(e) => setGuess(e.target.value)}
            placeholder="Beschreibe auf Deutsch, worum es bei diesem Meme geht…"
            rows={3}
            className="w-full rounded-lg py-3 px-4 text-sm font-sans focus:outline-none focus:ring-2"
            style={{ backgroundColor: "#EAD2C0", color: "#2B1D15", border: "1px solid #C2A278" }}
          />
          <button
            onClick={() => setRevealed(true)}
            className="w-full mt-3 rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-90 focus:outline-none focus:ring-2"
            style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
          >
            Auflösen
          </button>
        </div>
      ) : (
        <div className="mt-4">
          {guess.trim() && (
            <div className="rounded-lg p-3 mb-3 text-sm font-sans" style={{ backgroundColor: "#EAD2C0", color: "#7A5A3E" }}>
              <span className="text-[11px] uppercase tracking-wide block mb-1">Deine Antwort</span>
              {guess}
            </div>
          )}
          <div className="rounded-lg p-4 mb-3 text-sm font-sans leading-relaxed" style={{ backgroundColor: "#E4EEDD", color: "#2B1D15" }}>
            <span className="text-[11px] uppercase tracking-wide block mb-1" style={{ color: "#4A6B3D" }}>
              Auflösung
            </span>
            {item.explanationDe}
          </div>
          <div className="flex gap-3">
            <button
              onClick={() => markKnown(false)}
              className="flex-1 rounded-lg py-3 text-sm font-sans font-medium border transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
              style={{ borderColor: "#C2A278", color: "#2B1D15" }}
            >
              Nochmal üben
            </button>
            <button
              onClick={() => markKnown(true)}
              className="flex-1 flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
              style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
            >
              <Check size={16} /> Wusste ich
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

        <span className="text-xs font-mono" style={{ color: "#7A5A3E" }}>
          {mode === "mix"
            ? "Випадковий мікс"
            : mode === "flash"
            ? `Noch ${remaining} ${remaining === 1 ? "Karte" : "Karten"}`
            : `${pos + 1} / ${total}`}
        </span>
      </div>

      {WW_isHardWord(current) && !showText && (
        <div className="flex items-center gap-1.5 mb-2 text-xs font-sans" style={{ color: "#D4AF37" }}>
          <Star size={13} fill="#D4AF37" color="#2F5EA8" /> Schwieriges Wort
        </div>
      )}

      {showText ? (
        <WW_TextCard example={current.example} onContinue={onSkipText} />
      ) : mode === "flash" ? (
        <WW_FlashCard word={current} direction={direction} flipped={flipped} setFlipped={setFlipped} onAnswer={onFlashAnswer} />
      ) : mode === "mix" ? (
        <WW_MixCard word={current} direction={direction} flipped={flipped} setFlipped={setFlipped} onNext={onMixNext} onPrev={onMixPrev} />
      ) : (
        <WW_QuizCard word={current} direction={direction} options={quizOptions} choice={quizChoice} onAnswer={onQuizAnswer} />
      )}
    </div>
  );
}

function WW_QuizCard({ word, direction, options, choice, onAnswer }) {
  const isUaDe = direction === "ua-de";
  const question = isUaDe ? word.ua : word.de;
  const [fw, setFw] = useState(null);

  function handleChoice(opt) {
    if (opt.id === word.id) {
      setFw(WW_buildFireworkParticles());
      setTimeout(() => setFw(null), 900);
    }
    onAnswer(opt);
  }

  return (
    <div>
      <div className="relative rounded-xl p-8 mb-4 text-center" style={{ backgroundColor: "#F8EFDF" }}>
        <button
          onClick={() => WW_speakUkrainian(word.ua)}
          className="absolute top-3 right-3 rounded-full p-2 transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
          style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}
          aria-label="Ukrainische Aussprache anhören"
          title="Ukrainisch anhören"
        >
          <Volume2 size={16} />
        </button>
        <p className="font-serif text-3xl" style={{ color: "#2B1D15" }}>
          {question}
        </p>
        <p className="text-xs mt-3 font-sans" style={{ color: "#7A5A3E" }}>
          Welche Übersetzung ist richtig?
        </p>
        <WW_CorrectFirework particles={fw} />
      </div>
      <div className="space-y-2">
        {options.map((opt) => {
          const isCorrect = opt.id === word.id;
          const isChoice = choice?.id === opt.id;
          let bg = "#F8EFDF";
          let border = "#C2A278";
          let color = "#2B1D15";
          if (choice) {
            if (isCorrect) {
              bg = "#E4EEDD";
              border = "#4A6B3D";
              color = "#4A6B3D";
            } else if (isChoice) {
              bg = "#F5E0DD";
              border = "#D9A79E";
              color = "#A15347";
            }
          }
          return (
            <button
              key={opt.id}
              onClick={() => handleChoice(opt)}
              disabled={!!choice}
              className="w-full text-left rounded-lg py-3 px-4 text-sm font-sans border transition-colors focus:outline-none focus:ring-2"
              style={{ backgroundColor: bg, borderColor: border, color }}
            >
              {isUaDe ? opt.de : opt.ua}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function NUM_shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function NUM_speakUkrainian(text) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "uk-UA";
    u.rate = 0.85;
    synth.speak(u);
  } catch (e) {
    /* no-op */
  }
}

function NUM_buildFireworkParticles() {
  return Array.from({ length: 18 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.25;
    const dist = 70 + Math.random() * 80;
    return {
      id: i,
      tx: Math.cos(angle) * dist,
      ty: Math.sin(angle) * dist,
      rot: Math.random() * 360,
      delay: Math.random() * 100,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function NUM_CorrectFirework({ particles }) {
  if (!particles) return null;
  return (
    <div className="absolute inset-0 pointer-events-none overflow-visible">

        <span
          key={p.id}
          className="absolute left-1/2 top-1/2"
          style={{
            "--tx": `${p.tx}px`,
            "--ty": `${p.ty}px`,
            "--rot": `${p.rot}deg`,
            animation: `correctPop 900ms ease-out forwards`,
            animationDelay: `${p.delay}ms`,
            color: p.color,
          }}

  );
}

function NUM_useMotivation() {
  const [quote, setQuote] = useState(null);
  const [count, setCount] = useState(0);
  const lastRef = useRef(null);

  function bump(threshold = 4) {
    setCount((c) => {
      const nc = c + 1;
      if (nc >= threshold) {
        let pick = NUM_MOTIVATION_QUOTES[Math.floor(Math.random() * NUM_MOTIVATION_QUOTES.length)];
        if (NUM_MOTIVATION_QUOTES.length > 1) {
          while (pick === lastRef.current) {
            pick = NUM_MOTIVATION_QUOTES[Math.floor(Math.random() * NUM_MOTIVATION_QUOTES.length)];
          }
        }
        lastRef.current = pick;
        setQuote(pick);
        return 0;
      }
      return nc;
    });
  }

  return { quote, bump, dismiss: () => setQuote(null) };
}

function NUM_CardsMode({ pool, range, onBack }) {
  const [queue, setQueue] = useState(() => NUM_shuffle(pool));
  const [flipped, setFlipped] = useState(false);
  const [done, setDone] = useState(false);
  const [fw, setFw] = useState(null);
  const [hardCelebration, setHardCelebration] = useState(null);
  const hardQuoteRef = useRef(null);
  const total = pool.length;
  const item = queue[0];

  useEffect(() => {
    if (queue.length === 0 && !done) {
      setFw(NUM_buildFireworkParticles());
      setDone(true);
      if (range) HUB_markLessonCompleted(`num-${range.id}`, `Числа ${range.label}`, "cards");
    }
  }, [queue, done]);

  function markKnown(correct) {
    const card = queue[0];
    setQueue((q) => {
      const rest = q.slice(1);
      if (correct) return rest;
      const insertAt = Math.min(rest.length, 2 + Math.floor(Math.random() * 3));
      const requeued = [...rest];
      requeued.splice(insertAt, 0, card);
      return requeued;
    });
    setFlipped(false);
    if (correct) {
      HUB_bumpDailyCorrect(1);
      setFw(NUM_buildFireworkParticles());
      setTimeout(() => setFw(null), 900);
      if (NUM_isHardWord(card)) {
        let pick = NUM_HARD_WORD_QUOTES[Math.floor(Math.random() * NUM_HARD_WORD_QUOTES.length)];
        if (NUM_HARD_WORD_QUOTES.length > 1) {
          while (pick === hardQuoteRef.current) {
            pick = NUM_HARD_WORD_QUOTES[Math.floor(Math.random() * NUM_HARD_WORD_QUOTES.length)];
          }
        }
        hardQuoteRef.current = pick;
        setHardCelebration(pick);
      }
    }
  }

  if (done) {
    return (
      <div>
        <NUM_BackBar onBack={onBack} />
        <div className="relative rounded-xl p-8 text-center overflow-visible" style={{ backgroundColor: "#F8EFDF" }}>
          <NUM_CorrectFirework particles={fw} />
          <p className="font-serif text-2xl" style={{ color: "#D4AF37" }}>
            Runde geschafft!
          </p>
          <p className="text-sm mt-2 font-sans" style={{ color: "#7A5A3E" }}>
            Du kennst jetzt alle {total} Zahlen dieser Runde.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div>
      <NUM_HardWordWaterfall quote={hardCelebration} onDismiss={() => setHardCelebration(null)} />
      <NUM_BackBar onBack={onBack} right={`Noch ${queue.length} ${queue.length === 1 ? "Karte" : "Karten"}`} />

      {NUM_isHardWord(item) && (
        <div className="flex items-center gap-1.5 mb-2 text-xs font-sans" style={{ color: "#D4AF37" }}>
          <Star size={13} fill="#D4AF37" color="#2F5EA8" /> Schwieriges Wort
        </div>
      )}

      <div className="relative">
        <button
          onClick={() => setFlipped((f) => !f)}
          className="w-full rounded-xl p-8 min-h-[220px] flex flex-col items-center justify-center text-center focus:outline-none focus:ring-2"
          style={{ backgroundColor: "#F8EFDF" }}
        >
          {!flipped ? (
            <>
              <p className="font-serif text-6xl" style={{ color: "#2B1D15" }}>
                {item.num}
              </p>
              <p className="text-xs mt-4 font-sans flex items-center gap-1" style={{ color: "#7A5A3E" }}>
                <RotateCw size={12} /> Antippen zum Umdrehen
              </p>
            </>
          ) : (
            <>
              <p className="font-serif text-4xl" style={{ color: "#D4AF37" }}>
                {item.ua}
              </p>
              <p className="text-sm mt-2 font-sans" style={{ color: "#7A5A3E" }}>
                {item.translit}
              </p>
            </>
          )}
        </button>
        {flipped && (
          <button
            onClick={(e) => {
              e.stopPropagation();
              NUM_speakUkrainian(item.ua);
            }}
            className="absolute top-3 right-3 rounded-full p-2 transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
            style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}
            aria-label="Ukrainische Aussprache anhören"
            title="Ukrainisch anhören"
          >
            <Volume2 size={16} />
          </button>
        )}
      </div>

      <div className="flex gap-3 mt-4">
        <button
          onClick={() => markKnown(false)}
          className="flex-1 rounded-lg py-3 text-sm font-sans font-medium border transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
          style={{ borderColor: "#C2A278", color: "#2B1D15" }}
        >
          Nochmal üben
        </button>
        <button
          onClick={() => markKnown(true)}
          className="flex-1 flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
          style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
        >
          <Check size={16} /> Kannte ich
        </button>
      </div>
    </div>
  );
}

function NUM_buildQuizRound(pool) {
  const target = pool[Math.floor(Math.random() * pool.length)];
  const distractorPool = pool.filter((n) => n.num !== target.num);
  const distractors = NUM_shuffle(distractorPool).slice(0, 3);
  const options = NUM_shuffle([target, ...distractors]);
  return { target, options };
}

      setFw(NUM_buildFireworkParticles());
      setTimeout(() => {
        setFw(null);
        motivation.bump(4);

  return (
    <div>

          return (

      {choice && choice.num !== round.target.num && (
        <button
          onClick={() => {
            setRound(NUM_buildQuizRound(pool));
            setChoice(null);
          }}

        </button>
      )}

  );
}

function NUM_buildMathRound(range) {
  const isAdd = Math.random() < 0.5;
  let a, b, result;
  result = range.min + Math.floor(Math.random() * (range.max - range.min + 1));
  if (isAdd) {
    a = 1 + Math.floor(Math.random() * Math.max(1, result - 1));
    b = result - a;
    if (b < 1) {
      b = 1;
      a = result - 1;
    }
  } else {
    const extra = 1 + Math.floor(Math.random() * Math.min(9, 30 - result));
    a = result + extra;
    b = extra;
  }

  const distractorNums = new Set([result]);
  while (distractorNums.size < 4) {
    const candidate = range.min + Math.floor(Math.random() * (range.max - range.min + 1));
    distractorNums.add(candidate);
  }
  const options = NUM_shuffle([...distractorNums].map((n) => NUM_NUMBERS[n - 1]));

  return {
    a: NUM_NUMBERS[a - 1],
    b: NUM_NUMBERS[b - 1],
    op: isAdd ? "+" : "−",
    result,
    options,
  };
}

const GIRL_MOTIVATION_QUOTES = [
  "Так тримати!",
  "Прогрес помітний!",
  "Молодець!",
  "Ще одне слово — ще один крок.",
  "Не зупиняйся!",
  "Виходить дедалі краще.",
  "Практика робить майстра.",
  "У тебе виходить!",
  "Малі кроки — великий прогрес.",
  "Чудовий темп!",
  "Не здавайся!",
  "Вчишся як профі.",
  "Кожне слово важливе.",
  "Вперед!",
];

const GIRL_HARD_WORD_QUOTES = [
  "Складне слово, і ти впорався!",
  "Ти зміг подолати складне слово!",
  "Оце майстерність!",
  "Важке слово — легка перемога!",
  "Ти справжній профі!",
  "Неймовірно складне слово, чудова робота!",
];

const GIRL_HARD_WORD_MIN_LENGTH = 12;

function GIRL_isHardWord(word) {
  return !!word && word.ua && word.ua.length >= GIRL_HARD_WORD_MIN_LENGTH;
}

function GIRL_HardWordWaterfall({ quote, onDismiss }) {
  if (!quote) return null;
  const stars = Array.from({ length: 26 }).map((_, i) => ({
    id: i,
    left: Math.random() * 100,
    delay: Math.random() * 700,
    duration: 1600 + Math.random() * 900,
    size: 12 + Math.random() * 14,
    rotate: Math.random() * 360,
    color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
  }));

  return (
    <div className="fixed inset-0 z-50" style={{ backgroundColor: "rgba(58,38,28,0.55)" }} onClick={onDismiss}>
      <style>{`
        @keyframes girlFallDown {
          0%   { opacity: 0; transform: translateY(-10vh) rotate(0deg); }
          8%   { opacity: 1; }
          100% { opacity: 0.9; transform: translateY(115vh) rotate(var(--rot)); }
        }
      `}</style>
      <div className="absolute inset-0 overflow-hidden pointer-events-none">
        {stars.map((s) => (
          <span
            key={s.id}
            className="absolute"
            style={{
              left: `${s.left}%`,

function GIRL_shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function GIRL_normalize(s) {
  return (s || "")
    .toLowerCase()
    .trim()
    .replace(/['’ʼ`]/g, "")
    .replace(/[.,!?;:]/g, "")
    .replace(/\s+/g, " ");
}

function GIRL_levenshtein(a, b) {
  const m = a.length,
    n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] =
        a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}

function GIRL_isCorrect(input, answers) {
  const t = GIRL_normalize(input);
  if (!t) return false;
  return answers.some((ans) => {
    const w = GIRL_normalize(ans);
    if (t === w) return true;
    const threshold = Math.max(1, Math.round(w.length * 0.15));
    return GIRL_levenshtein(t, w) <= threshold;
  });
}

function GIRL_speakUkrainian(text) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "uk-UA";
    u.rate = 0.9;
    synth.speak(u);
  } catch (e) {
    /* no-op */
  }
}

function GIRL_buildFireworkParticles() {
  return Array.from({ length: 18 }).map((_, i) => {
    const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.25;
    const dist = 70 + Math.random() * 80;
    return {
      id: i,
      tx: Math.cos(angle) * dist,
      ty: Math.sin(angle) * dist,
      rot: Math.random() * 360,
      delay: Math.random() * 100,
      color: i % 2 === 0 ? "#2F5EA8" : "#D4AF37",
    };
  });
}

function GIRL_VerbFlashcards({ onBack }) {
  const [queue, setQueue] = useState(() => GIRL_shuffle(GIRL_VERB_INFINITIVES));
  const [flipped, setFlipped] = useState(false);
  const [done, setDone] = useState(false);
  const [fw, setFw] = useState(null);
  const [hardCelebration, setHardCelebration] = useState(null);
  const hardQuoteRef = useRef(null);
  const total = GIRL_VERB_INFINITIVES.length;
  const word = queue[0];

  useEffect(() => {
    if (queue.length === 0 && !done) {
      setFw(GIRL_buildFireworkParticles());
      setDone(true);
    }
  }, [queue, done]);

  function markKnown(correct) {
    const card = queue[0];
    setQueue((q) => {
      const rest = q.slice(1);
      if (correct) return rest;
      const insertAt = Math.min(rest.length, 2 + Math.floor(Math.random() * 3));
      const requeued = [...rest];
      requeued.splice(insertAt, 0, card);
      return requeued;
    });
    setFlipped(false);
    if (correct) {
      HUB_bumpDailyCorrect(1);
      setFw(GIRL_buildFireworkParticles());
      setTimeout(() => setFw(null), 900);
      if (GIRL_isHardWord(card)) {
        let pick = GIRL_HARD_WORD_QUOTES[Math.floor(Math.random() * GIRL_HARD_WORD_QUOTES.length)];
        if (GIRL_HARD_WORD_QUOTES.length > 1) {
          while (pick === hardQuoteRef.current) {
            pick = GIRL_HARD_WORD_QUOTES[Math.floor(Math.random() * GIRL_HARD_WORD_QUOTES.length)];
          }
        }
        hardQuoteRef.current = pick;
        setHardCelebration(pick);
      }
    }
  }

  if (done) {
    return (
      <div>
        <div className="flex items-center justify-between mb-4">
          <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans" style={{ color: "#7A5A3E" }}>

            Runde geschafft!

          <p className="text-sm mt-2 font-sans" style={{ color: "#7A5A3E" }}>
            Du kennst jetzt alle {total} Verben dieser Runde.
          </p>
        </div>
      </div>
    );

  return (
    <div>
      <GIRL_HardWordWaterfall quote={hardCelebration} onDismiss={() => setHardCelebration(null)} />
      <div className="flex items-center justify-between mb-4">
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-sans" style={{ color: "#7A5A3E" }}>
          <ChevronLeft size={16} /> Zurück
        </button>
        <span className="text-xs font-mono" style={{ color: "#7A5A3E" }}>
          Noch {queue.length} {queue.length === 1 ? "Karte" : "Karten"}

      </div>

        <div className="flex items-center gap-1.5 mb-2 text-xs font-sans" style={{ color: "#D4AF37" }}>

function GIRL_ScoVonaRobyt() {
  const [screen, setScreen] = useState("home"); // home | cards | game
  const [order, setOrder] = useState(() => GIRL_shuffle(GIRL_SCENES));
  const [round, setRound] = useState(0);
  const [input, setInput] = useState("");
  const [feedback, setFeedback] = useState(null); // null | "correct" | "wrong"
  const [attempts, setAttempts] = useState(0);
  const [score, setScore] = useState(0);
  const [fw, setFw] = useState(null);
  const [finished, setFinished] = useState(false);
  const [best, setBest] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [motivationQuote, setMotivationQuote] = useState(null);
  const lastQuoteRef = useRef(null);
  const inputRef = useRef(null);

  const scene = order[round];

  useEffect(() => {
    (async () => {
      try {
        const b = await window.storage.get("girlgame-best");
        if (b?.value) setBest(JSON.parse(b.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!finished || !loaded) return;
    if (best === null || score > best) {
      setBest(score);
      window.storage.set("girlgame-best", JSON.stringify(score)).catch(() => {});
    }
  }, [finished]);

  const [answeredSinceMotivation, setAnsweredSinceMotivation] = useState(0);

  function checkAnswer() {
    if (!scene) return;
    if (GIRL_isCorrect(input, scene.answers)) {
      setFeedback("correct");
      setScore((s) => s + Math.max(1, 3 - attempts));
      setFw(GIRL_buildFireworkParticles());
      HUB_bumpDailyCorrect(1);
      setTimeout(() => {
        setFw(null);
        goNext();
      }, 950);
    } else {
      setFeedback("wrong");
      setAttempts((a) => a + 1);
    }
  }

  function goNext() {
    setAnsweredSinceMotivation((c) => {
      const nc = c + 1;
      if (nc >= 3) {
        let pick = GIRL_MOTIVATION_QUOTES[Math.floor(Math.random() * GIRL_MOTIVATION_QUOTES.length)];
        if (GIRL_MOTIVATION_QUOTES.length > 1) {
          while (pick === lastQuoteRef.current) {
            pick = GIRL_MOTIVATION_QUOTES[Math.floor(Math.random() * GIRL_MOTIVATION_QUOTES.length)];
          }
        }
        lastQuoteRef.current = pick;
        setMotivationQuote(pick);
        return 0;
      }
      return nc;
    });
    if (round + 1 >= order.length) {
      setFinished(true);
      return;
    }
    setRound((r) => r + 1);
    setInput("");
    setFeedback(null);
    setAttempts(0);
    setTimeout(() => inputRef.current?.focus(), 50);
  }

  function restart() {
    setOrder(GIRL_shuffle(GIRL_SCENES));
    setRound(0);
    setInput("");
    setFeedback(null);
    setAttempts(0);
    setScore(0);
    setFinished(false);
    setFw(null);
  }

  return (
    <div className="min-h-screen w-full flex justify-center px-4 py-8" style={{ backgroundColor: "#E7D5B4" }}>
      <style>{`
        @keyframes correctPop {
          0%   { opacity: 1; transform: translate(-50%,-50%) scale(0.4) rotate(0deg); }
          70%  { opacity: 1; }
          100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.05) rotate(var(--rot)); }
        }
        @keyframes shakeX {
          0%, 100% { transform: translateX(0); }
          20% { transform: translateX(-6px); }
          40% { transform: translateX(6px); }
          60% { transform: translateX(-4px); }
          80% { transform: translateX(4px); }
        }
      `}</style>

      <GIRL_MotivationOverlay quote={motivationQuote} onDismiss={() => setMotivationQuote(null)} />

      <div className="w-full max-w-md">
        {screen === "home" && <GIRL_Home onCards={() => setScreen("cards")} onGame={() => setScreen("game")} />}

        {screen === "cards" && <GIRL_VerbFlashcards onBack={() => setScreen("home")} />}

        {screen === "game" && (
          <>
            <div className="flex items-center justify-between mb-1">
              <button
                onClick={() => setScreen("home")}
                className="flex items-center gap-1 text-sm font-sans"
                style={{ color: "#7A5A3E" }}
              >
                <ChevronLeft size={16} /> Zurück
              </button>
            </div>
            <p className="text-sm font-sans mb-5 mt-2" style={{ color: "#7A5A3E" }}>
              Schreib auf Ukrainisch, was das Mädchen gerade tut.

        {!finished ? (
          <>
            <div className="flex items-center justify-between mb-3">
              <span
                className="text-xs font-sans rounded-full px-3 py-1"
                style={{ backgroundColor: "#F8EFDF", color: "#D4AF37" }}

                {GIRL_TIME_LABELS[scene.time]}
              </span>
              <span className="text-xs font-mono" style={{ color: "#7A5A3E" }}>
                {round + 1} / {order.length}
              </span>
            </div>

            <div
              className="relative rounded-xl p-6 mb-4"
              style={{
                backgroundColor: "#F8EFDF",
                animation: feedback === "wrong" ? "shakeX 400ms ease-in-out" : undefined,

            >
              <GIRL_GirlFigure TimeIcon={scene.timeIcon} ActivityIcon={scene.activityIcon} />

            <input
              ref={inputRef}
              autoFocus
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && checkAnswer()}
              placeholder="вона..."
              className="w-full rounded-lg py-3 px-4 text-base font-sans mb-3 focus:outline-none focus:ring-2"
              style={{ backgroundColor: "#F8EFDF", color: "#2B1D15", border: "1px solid #C2A278" }}
              disabled={feedback === "correct"}
            />

            {feedback === "correct" && (
              <div className="flex items-center gap-2 text-sm font-sans mb-3" style={{ color: "#4A6B3D" }}>
                <Check size={16} /> Правильно!
              </div>
            )}
            {feedback === "wrong" && (
              <div className="flex items-center gap-2 text-sm font-sans mb-3" style={{ color: "#A15347" }}>
                <X size={16} /> Спробуй ще раз.
              </div>
            )}
            {feedback === "wrong" && attempts >= 2 && (
              <p className="text-xs font-sans mb-3" style={{ color: "#7A5A3E" }}>
                Hinweis: {scene.de}
              </p>
            )}

            <div className="flex gap-3">
              <button
                onClick={() => GIRL_speakUkrainian(scene.answers[0])}
                className="rounded-lg p-3 transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
                style={{ backgroundColor: "#2B1D15", color: "#D4AF37" }}
                aria-label="Ukrainische Aussprache anhören"
                title="Ukrainisch anhören"
              >
                <Volume2 size={18} />
              </button>
              <button
                onClick={checkAnswer}
                disabled={feedback === "correct" || !input.trim()}
                className="flex-1 rounded-lg py-3 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2 disabled:opacity-50"
                style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
              >
                Prüfen
              </button>
            </div>
          </>
        ) : (
          <div className="rounded-xl p-8 text-center" style={{ backgroundColor: "#F8EFDF" }}>
            <p className="font-serif text-2xl mb-2" style={{ color: "#D4AF37" }}>
              Готово!
            </p>
            <p className="text-sm font-sans mb-1" style={{ color: "#2B1D15" }}>
              {score} / {order.length * 3} Punkte
            </p>
            {best !== null && (
              <p className="text-xs font-sans mb-6" style={{ color: "#7A5A3E" }}>
                Bestleistung: {best} Punkte
              </p>
            )}
            <button
              onClick={restart}
              className="inline-flex items-center gap-2 rounded-lg px-5 py-3 text-sm font-sans font-medium transition-opacity hover:opacity-85 focus:outline-none focus:ring-2"
              style={{ backgroundColor: "#2F5EA8", color: "#2B1D15" }}
            >
              <RotateCw size={16} /> Nochmal spielen
            </button>
          </div>
        )}
          </>
        )}
      </div>
    </div>
  );
}
